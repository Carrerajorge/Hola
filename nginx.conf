# Blue-green upstream is defined in /etc/nginx/conf.d/iliagpt-upstream.conf
# (written directly by scripts/deploy-bluegreen.sh — do NOT hardcode a port here).

server {
    server_name iliagpt.com www.iliagpt.com;

    client_max_body_size 50M;
    server_tokens off;

    # ── Gzip compression ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/json application/javascript application/xml
        application/xml+rss image/svg+xml;

    # ── Security headers ──────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Custom error pages (shown when app is down/deploying) ─────────
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /etc/nginx/html;
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Retry-After "30" always;
    }

    # ── Block sensitive paths ─────────────────────────────────
    location ~ /\.(env|git|dockerignore) {
        deny all;
        return 404;
    }

    # API primero (para que el router del front NO lo capture)
    location ^~ /api/ {
        proxy_pass http://iliagpt;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;

        # Robustness during blue-green swap and warm-up
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Retry on any upstream failure — critical to survive slot restarts
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 20s;

        # Buffer tuning — prevent client timeout while app is slow
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;

        # Intercept errors so custom error_page kicks in for API too
        proxy_intercept_errors on;
    }

    # SSE / streaming endpoints — no buffering, no retry (would break SSE)
    location ^~ /api/chat/stream {
        proxy_pass http://iliagpt;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";   # keep-alive for SSE

        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;

        # SSE must NOT be buffered
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no" always;

        # No retry for streaming — one attempt only
        proxy_next_upstream off;
        proxy_intercept_errors on;
    }

    # Front / resto
    location / {
        proxy_pass http://iliagpt;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;

        # Robustness during blue-green swap and warm-up
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 20s;

        proxy_intercept_errors on;
    }

    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/letsencrypt/live/iliagpt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iliagpt.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name iliagpt.com www.iliagpt.com;
    return 301 https://$host$request_uri;
}
