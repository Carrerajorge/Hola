# Blue-green upstream is defined in /etc/nginx/conf.d/iliagpt-upstream.conf
# (symlink to iliagpt-upstream-blue.conf or iliagpt-upstream-green.conf).
# Managed by scripts/deploy-bluegreen.sh — do NOT hardcode a port here.

server {
    server_name iliagpt.com www.iliagpt.com;

    client_max_body_size 50M;

    # API primero (para que el router del front NO lo capture)
    location ^~ /api/ {
        proxy_pass http://iliagpt;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;

        # Anti-502 during blue-green swap and warm-up
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    # Front / resto
    location / {
        proxy_pass http://iliagpt;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;

        # Anti-502 during blue-green swap and warm-up
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;

    ssl_certificate /etc/letsencrypt/live/iliagpt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iliagpt.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name iliagpt.com www.iliagpt.com;
    return 301 https://$host$request_uri;
}
