name: hola-agent-fusion

services:
  hola:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hola-app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      SEARXNG_BASE_URL: http://searxng:8080
      OPEN_WEBUI_BASE_URL: http://open-webui:8080
      N8N_BASE_URL: http://n8n:5678
      FLOWISE_BASE_URL: http://flowise:3000
      LANGFUSE_BASE_URL: http://langfuse:3000
      OPENCLAW_BASE_URL: http://hola:5000
    ports:
      - "5000:5000"
    depends_on:
      - ollama
      - qdrant
      - searxng
      - open-webui
      - n8n
      - flowise
    networks:
      - fusion

  ollama:
    profiles: ["core"]
    image: ollama/ollama:latest
    container_name: fusion-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - fusion

  qdrant:
    profiles: ["core"]
    image: qdrant/qdrant:latest
    container_name: fusion-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - fusion

  searxng:
    profiles: ["core"]
    image: searxng/searxng:latest
    container_name: fusion-searxng
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8081/
      UWSGI_WORKERS: "2"
      UWSGI_THREADS: "4"
    networks:
      - fusion

  open-webui:
    profiles: ["core"]
    image: ghcr.io/open-webui/open-webui:main
    container_name: fusion-open-webui
    restart: unless-stopped
    ports:
      - "3003:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "False"
    depends_on:
      - ollama
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - fusion

  n8n:
    profiles: ["core"]
    image: n8nio/n8n:latest
    container_name: fusion-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/New_York
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - fusion

  flowise:
    profiles: ["core"]
    image: flowiseai/flowise:latest
    container_name: fusion-flowise
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      PORT: "3000"
    volumes:
      - flowise-data:/root/.flowise
    networks:
      - fusion

  langfuse-db:
    profiles: ["observability"]
    image: postgres:16
    container_name: fusion-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    networks:
      - fusion

  langfuse-redis:
    profiles: ["observability"]
    image: redis:7-alpine
    container_name: fusion-langfuse-redis
    restart: unless-stopped
    networks:
      - fusion

  langfuse:
    profiles: ["observability"]
    image: ghcr.io/langfuse/langfuse:2
    container_name: fusion-langfuse
    restart: unless-stopped
    depends_on:
      - langfuse-db
      - langfuse-redis
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: replace-me-before-production
      SALT: replace-me-before-production
      TELEMETRY_ENABLED: "false"
    networks:
      - fusion

networks:
  fusion:
    driver: bridge

volumes:
  ollama-data:
  qdrant-data:
  open-webui-data:
  n8n-data:
  flowise-data:
  langfuse-db-data:
