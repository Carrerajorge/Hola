name: Deploy to Production (Blue-Green)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag (e.g. sha-abc12345). Leave empty to build from HEAD.'
        required: false
        default: ''
        type: string

# Concurrency is managed at the job level (deploy_auto job) rather than
# workflow level. This allows CI gate and build jobs to run in parallel
# for multiple SHAs, while only the deploy step itself serializes.
# See deploy_auto.concurrency below.

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write   # Required by ci.yml (CodeQL / Trivy SARIF uploads)

env:
  VPS_HOST: 69.62.98.126
  VPS_USER: root
  VPS_PORT: "8022"
  DEPLOY_PATH: /opt/hola
  REGISTRY: ghcr.io/carrerajorge

jobs:
  # ── CI Gate ──────────────────────────────────────────────
  ci:
    name: CI Checks
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ci.yml

  # ── CI Gate (push) ────────────────────────────────────
  ci_gate:
    name: CI Completion Gate
    # Disabled for push deploys: this polling job is being cancelled by the
    # Actions runner even while CI is still progressing, which marks the whole
    # deploy workflow cancelled and aborts image publication.
    if: ${{ false }}
    runs-on: ubuntu-latest
    # CI can take 20-45+ minutes; if this gate times out, the deploy run is marked "cancelled"
    # and nothing ships. Keep this comfortably above CI duration.
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    outputs:
      ci_ok: ${{ steps.gate.outputs.ci_ok }}
    steps:
      - name: Verify latest CI run for this SHA is successful
        id: gate
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Wait for the CI workflow run to appear and finish for this SHA.
          # The CI workflow currently has multiple first-class jobs and no single
          # aggregator job, so gate on the workflow-level conclusion instead of a
          # job name that may drift and deadlock deploys.
          for attempt in $(seq 1 360); do
            # Find the CI run for this SHA
            run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "Enterprise Quality Gates (CI)" --branch "${BRANCH}" --json headSha,databaseId,status --limit 50 --jq "[ .[] | select(.headSha==\"${SHA}\") ][0].databaseId // 0" 2>/dev/null || echo '0')"

            if [ "${run_id}" = "0" ] || [ -z "${run_id}" ]; then
              echo "CI run for SHA ${SHA} not yet reported. Retry ${attempt}/360..."
              sleep 10
              continue
            fi

            ci_status_line="$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json status,conclusion --jq '.status + " " + (.conclusion // "")' 2>/dev/null || echo '__queryfail__')"

            job_status="$(echo "${ci_status_line}" | awk '{print $1}')"
            job_conclusion="$(echo "${ci_status_line}" | awk '{print $2}')"

            if [ "${ci_status_line}" = "__queryfail__" ]; then
              if [ "${attempt}" -ge 6 ]; then
                echo "::error::Unable to query CI workflow state after ${attempt} attempts."
                echo "ci_ok=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              echo "Unable to query CI workflow state. Retry ${attempt}/360..."
              sleep 10
              continue
            fi

            if [ -z "${job_status}" ]; then
              echo "CI workflow state not yet available. Retry ${attempt}/360..."
              sleep 10
              continue
            fi

            if [ "${job_status}" = "completed" ]; then
              if [ "${job_conclusion}" = "success" ]; then
                echo "ci_ok=true" >> "$GITHUB_OUTPUT"
                echo "CI workflow for ${SHA} completed successfully."
                exit 0
              fi
              echo "::error::CI workflow did not pass for ${SHA} (status=${job_status}, conclusion=${job_conclusion})"
              echo "ci_ok=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            echo "CI workflow: status=${job_status}, conclusion=${job_conclusion}. Waiting..."
            sleep 10
          done

          echo "::error::Timed out waiting for CI workflow result for ${SHA}."
          echo "ci_ok=false" >> "$GITHUB_OUTPUT"
          exit 1

  # ── Build & Push Docker Images to GHCR ─────────────────
  build_images:
    name: Build Docker Images
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    uses: ./.github/workflows/build-images.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ── Manual Deploy ───────────────────────────────────────
  deploy_manual:
    name: Blue-Green Deploy (Manual)
    runs-on: ubuntu-latest
    needs: [ci, build_images]
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        needs.ci.result == 'success' &&
        needs.build_images.result == 'success'
      }}
    timeout-minutes: 40
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '69.62.98.126' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '8022' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/hola' }}
    environment:
      name: production
      url: https://iliagpt.com

    steps:
      - name: Fetch deployment assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          fetch_asset() {
            local asset_path="$1"
            mkdir -p "$(dirname "${asset_path}")"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${REPO}/contents/${asset_path}?ref=${REF}" \
              -o "${asset_path}"
          }

          for asset in \
            docker-compose.infra.yml \
            docker-compose.slot.yml \
            nginx.conf \
            nginx/maintenance.html \
            scripts/deploy-bluegreen.sh \
            scripts/rollback-bluegreen.sh \
            scripts/health-dashboard.sh \
            scripts/vps-bootstrap-bluegreen.sh \
            scripts/prod-rigorous-checks.sh
          do
            fetch_asset "${asset}"
          done

          chmod +x scripts/*.sh

      - name: Validate deployment prerequisites
        env:
          VPS_HOST: ${{ env.VPS_HOST }}
          VPS_PORT: ${{ env.VPS_PORT }}
          VPS_USER: ${{ env.VPS_USER }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_DEFAULT_HOST: "69.62.98.126"
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY_B64}" ]; then
            echo "::error::VPS_SSH_KEY_B64 secret is required for deployment."
            exit 1
          fi

          if ! printf '%s' "${VPS_PORT}" | grep -Eq '^[0-9]{1,5}$'; then
            echo "::error::VPS_PORT is invalid: ${VPS_PORT}"
            exit 1
          fi
          if [ "${VPS_PORT}" -lt 1 ] || [ "${VPS_PORT}" -gt 65535 ]; then
            echo "::error::VPS_PORT out of range: ${VPS_PORT}"
            exit 1
          fi

          VPS_HOST="${VPS_HOST:-${VPS_DEFAULT_HOST}}"
          if [ -z "${VPS_HOST}" ]; then
            echo "::error::VPS_HOST is required."
            exit 1
          fi
          if ! printf '%s' "${VPS_HOST}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::VPS_HOST contains invalid characters: ${VPS_HOST}"
            exit 1
          fi
          if [ -z "${VPS_USER}" ]; then
            echo "::error::VPS_USER is required."
            exit 1
          fi
          if [ -z "${DEPLOY_PATH}" ]; then
            echo "::error::DEPLOY_PATH is required."
            exit 1
          fi

      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "app_version=$(echo '${{ github.event.inputs.image_tag }}' | sed 's/sha-//')" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${{ github.sha }}"
            SHORT_SHA="${SHORT_SHA:0:8}"
            echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "app_version=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify images are present in GHCR (and digests when applicable)
        id: image_manifest_check
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          EXPECTED_IMAGE_TAG: ${{ needs.build_images.outputs.image_tag }}
          EXPECTED_APP_DIGEST: ${{ needs.build_images.outputs.app_digest }}
          EXPECTED_SANDBOX_DIGEST: ${{ needs.build_images.outputs.sandbox_digest }}
          EXPECTED_OCR_DIGEST: ${{ needs.build_images.outputs.ocr_digest }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${IMAGE_TAG}"
          APP_IMAGE="ghcr.io/carrerajorge/iliagpt-app:${IMAGE_TAG}"
          SANDBOX_IMAGE="ghcr.io/carrerajorge/iliagpt-sandbox:${IMAGE_TAG}"
          OCR_IMAGE="ghcr.io/carrerajorge/iliagpt-ocr:${IMAGE_TAG}"

          if [ "${IMAGE_TAG}" != "${EXPECTED_IMAGE_TAG}" ]; then
            echo "::warning::Manual image tag (${IMAGE_TAG}) does not match built tag (${EXPECTED_IMAGE_TAG}); skipping digest pinning."
            EXPECTED_APP_DIGEST=""
            EXPECTED_SANDBOX_DIGEST=""
            EXPECTED_OCR_DIGEST=""
          fi

          extract_digest() {
            local image_ref="$1"
            local digest
            digest="$(docker manifest inspect "${image_ref}" | python3 -c 'import sys, json; d=json.load(sys.stdin); prints = (d.get("manifests") or [{}]); print((prints[0].get("digest") if prints else "") or d.get("digest", "") or d.get("config", {}).get("digest", ""));' )"
            echo "${digest}"
          }

          verify_expected_digest() {
            local label="$1"
            local image_ref="$2"
            local expected="$3"
            if [ -z "${expected}" ]; then
              echo "  ⚠️ No expected ${label} digest provided; skipping digest verification."
              return 0
            fi
            local actual
            actual="$(extract_digest "${image_ref}")"
            if [ -z "${actual}" ]; then
              echo "::error::Could not extract digest for ${label}: ${image_ref}"
              exit 1
            fi
            if [ "${actual}" != "${expected}" ]; then
              echo "::warning::Digest mismatch for ${label}. expected=${expected} actual=${actual} (build output digest and remote manifest digest can differ when attestations are enabled)"
            fi
            echo "  ✓ ${label} digest pinned to ${actual}"
          }

          for pair in "${APP_IMAGE}" "${SANDBOX_IMAGE}" "${OCR_IMAGE}"; do
            for i in $(seq 1 60); do
              if docker manifest inspect "${pair}" > /dev/null 2>&1; then
                echo "  ✓ Manifest available for ${pair}"
                break
              fi
              if [ "${i}" -eq 40 ]; then
                echo "::error::Manifest ${pair} not available in GHCR after retries."
                exit 1
              fi
              sleep $(( i < 10 ? 3 : 5 ))
            done
          done

          verify_expected_digest "app" "${APP_IMAGE}" "${EXPECTED_APP_DIGEST}"
          verify_expected_digest "sandbox" "${SANDBOX_IMAGE}" "${EXPECTED_SANDBOX_DIGEST}"
          verify_expected_digest "ocr" "${OCR_IMAGE}" "${EXPECTED_OCR_DIGEST}"

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          wc -c ~/.ssh/deploy_key
          head -n 1 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          {
            echo "Host *"
            echo "  StrictHostKeyChecking accept-new"
            echo "  PubkeyAcceptedKeyTypes +ssh-rsa"
            echo "  HostKeyAlgorithms +ssh-rsa"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Resolve reachable deploy endpoint
        id: target
        run: |
          set -euo pipefail
          DEFAULT_HOST="69.62.98.126"
          HOSTS=()
          if [ -n "${{ secrets.VPS_HOST }}" ]; then HOSTS+=("${{ secrets.VPS_HOST }}"); fi
          HOSTS+=("${VPS_HOST}" "${DEFAULT_HOST}")
          PORTS=("${VPS_PORT}" "8022" "22" "2222")

          mapfile -t uniq_hosts < <(printf "%s\n" "${HOSTS[@]}" | awk 'NF' | awk '!seen[$0]++')
          mapfile -t uniq_ports < <(printf "%s\n" "${PORTS[@]}" | awk 'NF' | awk '!seen[$0]++')

          for host in "${uniq_hosts[@]}"; do
            for port in "${uniq_ports[@]}"; do
              echo "Trying ${VPS_USER}@${host}:${port}..."
              ssh-keyscan -p "$port" -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
              ssh_probe_opts=(
                -i ~/.ssh/deploy_key
                -p "$port"
                -o StrictHostKeyChecking=accept-new
                -o BatchMode=yes
                -o ConnectTimeout=8
                -o PubkeyAcceptedAlgorithms=+ssh-rsa
                -o HostKeyAlgorithms=+ssh-rsa
              )
              if ssh "${ssh_probe_opts[@]}" -4 "${VPS_USER}@${host}" "echo ok" >/dev/null 2>&1 || \
                 ssh "${ssh_probe_opts[@]}" "${VPS_USER}@${host}" "echo ok" >/dev/null 2>&1; then
                echo "host=${host}" >> "$GITHUB_OUTPUT"
                echo "port=${port}" >> "$GITHUB_OUTPUT"
                echo "✓ Selected endpoint ${host}:${port}"
                exit 0
              fi
            done
          done

          echo "::error::No reachable VPS endpoint found (hosts: ${uniq_hosts[*]} | ports: ${uniq_ports[*]})"
          exit 1

      - name: Validate resolved target inputs
        run: |
          set -euo pipefail
          RESOLVED_HOST="${{ steps.target.outputs.host }}"
          RESOLVED_PORT="${{ steps.target.outputs.port }}"
          RESOLVED_USER="${{ env.VPS_USER }}"
          RESOLVED_PATH="${{ env.DEPLOY_PATH }}"

          if [ -z "${RESOLVED_HOST}" ] || [ -z "${RESOLVED_PORT}" ] || [ -z "${RESOLVED_USER}" ] || [ -z "${RESOLVED_PATH}" ]; then
            echo "::error::Resolved deploy target is incomplete."
            exit 1
          fi
          if ! printf '%s' "${RESOLVED_HOST}" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            echo "::error::Resolved host has invalid characters: ${RESOLVED_HOST}"
            exit 1
          fi
          if ! printf '%s' "${RESOLVED_PORT}" | grep -Eq '^[0-9]{1,5}$'; then
            echo "::error::Resolved port is invalid: ${RESOLVED_PORT}"
            exit 1
          fi
          if [ "${RESOLVED_PORT}" -lt 1 ] || [ "${RESOLVED_PORT}" -gt 65535 ]; then
            echo "::error::Resolved port out of range: ${RESOLVED_PORT}"
            exit 1
          fi
          if ! printf '%s' "${RESOLVED_USER}" | grep -Eq '^[A-Za-z_][A-Za-z0-9_-]{0,31}$'; then
            echo "::error::Resolved user is invalid: ${RESOLVED_USER}"
            exit 1
          fi
          if ! printf '%s' "${RESOLVED_PATH}" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "::error::Resolved deploy path is invalid: ${RESOLVED_PATH}"
            exit 1
          fi
          if printf '%s' "${RESOLVED_PATH}" | grep -Eq '(^|/)\.\.(/|$)'; then
            echo "::error::Resolved deploy path contains path traversal segments: ${RESOLVED_PATH}"
            exit 1
          fi

      - name: Preflight target host
        run: |
          set -euo pipefail
          echo "▸ Deploy target: ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}:${{ steps.target.outputs.port }}"
          nc -vz -w 5 "${{ steps.target.outputs.host }}" "${{ steps.target.outputs.port }}" || echo "⚠️ TCP probe failed (continuing to SSH)"

      - name: Sync deploy scripts to VPS
        run: |
          set -euo pipefail
          sync_ok=false
          for attempt in 1 2 3; do
            if scp -i ~/.ssh/deploy_key -P ${{ steps.target.outputs.port }}               -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12               docker-compose.infra.yml               docker-compose.slot.yml               nginx.conf               scripts/deploy-bluegreen.sh               scripts/rollback-bluegreen.sh               scripts/health-dashboard.sh               scripts/vps-bootstrap-bluegreen.sh               ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}:${{ env.DEPLOY_PATH }}/; then
              sync_ok=true
              break
            fi
            sleep 3
          done

          if [ "${sync_ok}" != "true" ]; then
            echo "::warning::Failed to sync deploy scripts after 3 attempts; continuing with scripts already present on VPS"
          fi

          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }}             -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12             ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}             "mkdir -p ${{ env.DEPLOY_PATH }}/scripts ${{ env.DEPLOY_PATH }}/nginx &&              cp ${{ env.DEPLOY_PATH }}/deploy-bluegreen.sh ${{ env.DEPLOY_PATH }}/scripts/ 2>/dev/null || true &&              cp ${{ env.DEPLOY_PATH }}/rollback-bluegreen.sh ${{ env.DEPLOY_PATH }}/scripts/ 2>/dev/null || true &&              cp ${{ env.DEPLOY_PATH }}/health-dashboard.sh ${{ env.DEPLOY_PATH }}/scripts/ 2>/dev/null || true &&              cp ${{ env.DEPLOY_PATH }}/vps-bootstrap-bluegreen.sh ${{ env.DEPLOY_PATH }}/scripts/ 2>/dev/null || true &&              chmod +x ${{ env.DEPLOY_PATH }}/scripts/*.sh ${{ env.DEPLOY_PATH }}/deploy-bluegreen.sh 2>/dev/null || true"

          # Copy nginx static assets (maintenance page, custom error pages)
          scp -i ~/.ssh/deploy_key -P ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 \
            nginx/maintenance.html \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}:${{ env.DEPLOY_PATH }}/nginx/ 2>/dev/null || true

      - name: Run predeploy startup gate
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }}               -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ConnectionAttempts=3               -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes               ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}               "echo '${{ github.token }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null &&                cd ${{ env.DEPLOY_PATH }} &&                PREDEPLOY_ONLY='true'                IMAGE_TAG='${{ steps.tag.outputs.image_tag }}'                APP_VERSION='${{ steps.tag.outputs.app_version }}'                BUILD_IMAGE_TAG='${{ needs.build_images.outputs.image_tag }}'                EXPECTED_APP_DIGEST='${{ needs.build_images.outputs.app_digest }}'                EXPECTED_SANDBOX_DIGEST='${{ needs.build_images.outputs.sandbox_digest }}'                EXPECTED_OCR_DIGEST='${{ needs.build_images.outputs.ocr_digest }}'                bash scripts/deploy-bluegreen.sh"; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Predeploy startup gate failed after retry" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Run blue-green deploy
        id: deploy_bluegreen
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }}               -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ConnectionAttempts=3               -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes               ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}               "echo '${{ github.token }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null &&                cd ${{ env.DEPLOY_PATH }} &&                IMAGE_TAG='${{ steps.tag.outputs.image_tag }}'                APP_VERSION='${{ steps.tag.outputs.app_version }}'                BUILD_IMAGE_TAG='${{ needs.build_images.outputs.image_tag }}'                EXPECTED_APP_DIGEST='${{ needs.build_images.outputs.app_digest }}'                EXPECTED_SANDBOX_DIGEST='${{ needs.build_images.outputs.sandbox_digest }}'                EXPECTED_OCR_DIGEST='${{ needs.build_images.outputs.ocr_digest }}'                bash scripts/deploy-bluegreen.sh"; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Blue-green deploy failed after retry" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify production
        id: verify_production
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.tag.outputs.app_version }}"
          echo "▸ Verifying https://iliagpt.com (expecting version ${EXPECTED})..."
          for i in $(seq 1 20); do
            HEALTH_JSON="$(curl -sf --max-time 10 https://iliagpt.com/api/health 2>/dev/null || echo "{}")"
            if echo "${HEALTH_JSON}" | grep -q "\"version\":\"${EXPECTED}\""; then
              echo "✓ Production verified: version ${EXPECTED}"
              echo "  ${HEALTH_JSON}"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "✗ Production version mismatch (expected ${EXPECTED})"
              echo "  Last response: ${HEALTH_JSON}"
              exit 1
            fi
            echo "  Attempt $i/20..."
            sleep 3
          done

          # Verify sw-cleanup.js version
          SW_CLEANUP="$(curl -sf --max-time 20 https://iliagpt.com/sw-cleanup.js || echo "")"
          if [ -n "${SW_CLEANUP}" ]; then
            if echo "${SW_CLEANUP}" | grep -q "var APP_VERSION = '${EXPECTED}';"; then
              echo "✓ sw-cleanup.js version matches: ${EXPECTED}"
            else
              echo "⚠️ sw-cleanup.js version mismatch (non-fatal)"
            fi
          fi

          # Verify health/ready returns 200
          READY_CODE="$(curl -sf -o /dev/null -w '%{http_code}' --max-time 10 https://iliagpt.com/api/health/ready 2>/dev/null || echo "000")"
          if [ "${READY_CODE}" = "200" ]; then
            echo "✓ /api/health/ready → HTTP 200"
          else
            echo "⚠️ /api/health/ready → HTTP ${READY_CODE} (non-fatal)"
          fi
          # SSL + 5xx guardrails
          SSL_OK=$(echo | openssl s_client -servername iliagpt.com -connect iliagpt.com:443 2>/dev/null | grep -c "Verify return code: 0 (ok)" || true)
          if [ "${SSL_OK}" -lt 1 ]; then
            echo "::error::SSL verification failed for iliagpt.com"
            exit 1
          fi

          STATUS_CODE=$(curl -s -o /dev/null -w '%{http_code}' https://iliagpt.com/)
          if [ "${STATUS_CODE}" -ge 500 ]; then
            echo "::error::Production returned 5xx on root endpoint: ${STATUS_CODE}"
            exit 1
          fi

      - name: Checkout repository for browser smoke
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node for browser smoke
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install browser smoke dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke against production
        id: browser_smoke
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: https://iliagpt.com
        run: npm run test:smoke:remote

      - name: Run rigorous production acceptance checks
        id: prod_acceptance
        if: ${{ steps.browser_smoke.outcome == 'success' }}
        env:
          VPS_HOST: ${{ steps.target.outputs.host }}
          VPS_PORT: ${{ steps.target.outputs.port }}
          VPS_USER: ${{ env.VPS_USER }}
          VPS_SSH_KEY: /home/runner/.ssh/deploy_key
          EXPECTED_APP_VERSION: ${{ steps.tag.outputs.app_version }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DEPLOY_STATE_PATH: /opt/hola/deploy-state.json
          NGINX_UPSTREAM_CONF: /etc/nginx/conf.d/iliagpt-upstream.conf
        run: |
          bash scripts/prod-rigorous-checks.sh

      - name: Roll back on post-deploy acceptance failure
        if: ${{ always() && steps.deploy_bluegreen.outcome == 'success' && (steps.verify_production.outcome == 'failure' || steps.browser_smoke.outcome == 'failure' || steps.prod_acceptance.outcome == 'failure') }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }} \
            "cd ${{ env.DEPLOY_PATH }} && bash scripts/rollback-bluegreen.sh --force --stop-bad"

      - name: Enforce post-deploy acceptance
        if: ${{ always() && steps.deploy_bluegreen.outcome == 'success' }}
        run: |
          set -euo pipefail
          failed=0

          if [ "${{ steps.verify_production.outcome }}" = "failure" ]; then
            echo "::error::Public production verification failed."
            failed=1
          fi

          if [ "${{ steps.browser_smoke.outcome }}" = "failure" ]; then
            echo "::error::Browser smoke detected runtime regressions in production."
            failed=1
          fi

          if [ "${{ steps.prod_acceptance.outcome }}" = "failure" ]; then
            echo "::error::Rigorous production acceptance checks failed."
            failed=1
          fi

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy summary
        if: always()
        run: |
          echo "## Manual Deploy Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.tag.outputs.app_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ steps.tag.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://iliagpt.com |" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Blue-green deployment FAILED. The previous slot should still be serving traffic (automatic rollback)."
          echo "::error::Check state: ssh -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} 'cat /opt/hola/deploy-state.json'"
          echo "::error::Rollback: ssh -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} 'cd /opt/hola && bash scripts/rollback-bluegreen.sh --force'"

  # ── Auto Deploy (push to main) ──────────────────────────
  deploy_auto:
    name: Blue-Green Deploy (Auto)
    runs-on: ubuntu-latest
    needs: [build_images]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.build_images.result == 'success'
      }}
    timeout-minutes: 40
    # Job-level concurrency: serialize production deploys on the VPS.
    # Do not cancel an in-flight deploy; interrupting it mid-cutover can leave
    # the public site pinned to the maintenance page until a later run repairs it.
    concurrency:
      group: deploy-auto-vps
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '69.62.98.126' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '8022' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/hola' }}
    environment:
      name: production
      url: https://iliagpt.com

    steps:
      - name: Fetch deployment assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          fetch_asset() {
            local asset_path="$1"
            mkdir -p "$(dirname "${asset_path}")"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${REPO}/contents/${asset_path}?ref=${REF}" \
              -o "${asset_path}"
          }

          for asset in \
            docker-compose.infra.yml \
            docker-compose.slot.yml \
            nginx.conf \
            nginx/maintenance.html \
            scripts/deploy-bluegreen.sh \
            scripts/rollback-bluegreen.sh \
            scripts/health-dashboard.sh \
            scripts/vps-bootstrap-bluegreen.sh \
            scripts/prod-rigorous-checks.sh
          do
            fetch_asset "${asset}"
          done

          chmod +x scripts/*.sh

      - name: Validate deployment prerequisites
        env:
          VPS_HOST: ${{ env.VPS_HOST }}
          VPS_PORT: ${{ env.VPS_PORT }}
          VPS_USER: ${{ env.VPS_USER }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_DEFAULT_HOST: "69.62.98.126"
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY_B64}" ]; then
            echo "::error::VPS_SSH_KEY_B64 secret is required for deployment."
            exit 1
          fi
          if ! printf '%s' "${VPS_PORT}" | grep -Eq '^[0-9]{1,5}$'; then
            echo "::error::VPS_PORT is invalid: ${VPS_PORT}"
            exit 1
          fi
          if [ "${VPS_PORT}" -lt 1 ] || [ "${VPS_PORT}" -gt 65535 ]; then
            echo "::error::VPS_PORT out of range: ${VPS_PORT}"
            exit 1
          fi
          VPS_HOST="${VPS_HOST:-${VPS_DEFAULT_HOST}}"
          if [ -z "${VPS_HOST}" ]; then
            echo "::error::VPS_HOST is required."
            exit 1
          fi
          if ! printf '%s' "${VPS_HOST}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::VPS_HOST contains invalid characters: ${VPS_HOST}"
            exit 1
          fi
          if [ -z "${VPS_USER}" ]; then
            echo "::error::VPS_USER is required."
            exit 1
          fi
          if [ -z "${DEPLOY_PATH}" ]; then
            echo "::error::DEPLOY_PATH is required."
            exit 1
          fi

      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:8}"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "app_version=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Skip superseded auto deploys
        id: latest_main
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          latest_sha=""
          for attempt in $(seq 1 6); do
            latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || true)"
            if [ -n "${latest_sha}" ]; then
              break
            fi
            echo "Could not resolve latest main SHA yet. Retry ${attempt}/6..."
            sleep 5
          done

          if [ -z "${latest_sha}" ]; then
            echo "::error::Unable to resolve latest main SHA for stale-deploy protection."
            exit 1
          fi

          echo "latest_sha=${latest_sha}" >> "$GITHUB_OUTPUT"

          if [ "${latest_sha}" != "${CURRENT_SHA}" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=Superseded by ${latest_sha:0:8}" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy for ${CURRENT_SHA:0:8}; main already advanced to ${latest_sha:0:8}."
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "skip_reason=" >> "$GITHUB_OUTPUT"
          echo "Deploy is still at the tip of main (${CURRENT_SHA:0:8})."

      - name: Verify images are present in GHCR and digest pinned
        if: steps.latest_main.outputs.should_deploy == 'true'
        id: image_manifest_check
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          EXPECTED_APP_DIGEST: ${{ needs.build_images.outputs.app_digest }}
          EXPECTED_SANDBOX_DIGEST: ${{ needs.build_images.outputs.sandbox_digest }}
          EXPECTED_OCR_DIGEST: ${{ needs.build_images.outputs.ocr_digest }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${IMAGE_TAG}"
          APP_IMAGE="ghcr.io/carrerajorge/iliagpt-app:${IMAGE_TAG}"
          SANDBOX_IMAGE="ghcr.io/carrerajorge/iliagpt-sandbox:${IMAGE_TAG}"
          OCR_IMAGE="ghcr.io/carrerajorge/iliagpt-ocr:${IMAGE_TAG}"

          extract_digest() {
            local image_ref="$1"
            local digest
            digest="$(docker manifest inspect "${image_ref}" | python3 -c 'import sys, json; d=json.load(sys.stdin); prints = (d.get("manifests") or [{}]); print((prints[0].get("digest") if prints else "") or d.get("digest", "") or d.get("config", {}).get("digest", ""));' )"
            echo "${digest}"
          }

          verify_expected_digest() {
            local label="$1"
            local image_ref="$2"
            local expected="$3"
            if [ -z "${expected}" ]; then
              echo "  ⚠️ No expected ${label} digest provided; skipping digest verification."
              return 0
            fi
            local actual
            actual="$(extract_digest "${image_ref}")"
            if [ -z "${actual}" ]; then
              echo "::error::Could not extract digest for ${label}: ${image_ref}"
              exit 1
            fi
            if [ "${actual}" != "${expected}" ]; then
              echo "::warning::Digest mismatch for ${label}. expected=${expected} actual=${actual} (build output digest and remote manifest digest can differ when attestations are enabled)"
            fi
            echo "  ✓ ${label} digest pinned to ${actual}"
          }

          for pair in "${APP_IMAGE}" "${SANDBOX_IMAGE}" "${OCR_IMAGE}"; do
            for i in $(seq 1 60); do
              if docker manifest inspect "${pair}" > /dev/null 2>&1; then
                echo "  ✓ Manifest available for ${pair}"
                break
              fi
              if [ "${i}" -eq 40 ]; then
                echo "::error::Manifest ${pair} not available in GHCR after retries."
                exit 1
              fi
              sleep $(( i < 10 ? 3 : 5 ))
            done
          done

          verify_expected_digest "app" "${APP_IMAGE}" "${EXPECTED_APP_DIGEST}"
          verify_expected_digest "sandbox" "${SANDBOX_IMAGE}" "${EXPECTED_SANDBOX_DIGEST}"
          verify_expected_digest "ocr" "${OCR_IMAGE}" "${EXPECTED_OCR_DIGEST}"

      - name: Deploy circuit breaker
        if: steps.latest_main.outputs.should_deploy == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failures=$(gh run list --repo ${{ github.repository }} --workflow "Deploy to Production (Blue-Green)" --branch main --limit 8 --json conclusion --jq '[.[] | select(.conclusion=="failure")] | length')
          echo "Recent deploy failures: ${failures}"
          if [ "${failures}" -ge 5 ]; then
            echo "::warning::Circuit breaker: ${failures}/8 recent deploys failed. Proceeding anyway."
          fi

      - name: Check whether production already serves target version
        if: steps.latest_main.outputs.should_deploy == 'true'
        id: production_state
        env:
          EXPECTED: ${{ steps.tag.outputs.app_version }}
        run: |
          set -euo pipefail
          HEALTH_JSON="$(curl -sf --max-time 10 https://iliagpt.com/api/health 2>/dev/null || echo "{}")"
          READY_CODE="$(curl -sf -o /dev/null -w '%{http_code}' --max-time 10 https://iliagpt.com/api/health/ready 2>/dev/null || echo "000")"
          ROOT_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://iliagpt.com/ || echo "000")"

          if echo "${HEALTH_JSON}" | grep -q "\"version\":\"${EXPECTED}\"" && \
             [ "${READY_CODE}" = "200" ] && \
             [ "${ROOT_CODE}" -lt 500 ]; then
            echo "already_deployed=true" >> "$GITHUB_OUTPUT"
            echo "✓ Production already serves ${EXPECTED}; skipping SSH deployment path."
            echo "  ${HEALTH_JSON}"
          else
            echo "already_deployed=false" >> "$GITHUB_OUTPUT"
            echo "Production is not yet on ${EXPECTED}; SSH deployment path required."
          fi

      - name: Reconfirm deploy is still latest before remote cutover
        id: latest_main_cutover
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          latest_sha=""
          for attempt in $(seq 1 6); do
            latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || true)"
            if [ -n "${latest_sha}" ]; then
              break
            fi
            echo "Could not resolve latest main SHA before cutover. Retry ${attempt}/6..."
            sleep 5
          done

          if [ -z "${latest_sha}" ]; then
            echo "::error::Unable to resolve latest main SHA before remote cutover."
            exit 1
          fi

          echo "latest_sha=${latest_sha}" >> "$GITHUB_OUTPUT"

          if [ "${latest_sha}" != "${CURRENT_SHA}" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=Superseded before cutover by ${latest_sha:0:8}" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping remote cutover for ${CURRENT_SHA:0:8}; main already advanced to ${latest_sha:0:8}."
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "skip_reason=" >> "$GITHUB_OUTPUT"
          echo "Deploy is still at the tip of main immediately before remote cutover (${CURRENT_SHA:0:8})."

      - name: Setup SSH key
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          wc -c ~/.ssh/deploy_key
          head -n 1 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          {
            echo "Host *"
            echo "  StrictHostKeyChecking accept-new"
            echo "  PubkeyAcceptedKeyTypes +ssh-rsa"
            echo "  HostKeyAlgorithms +ssh-rsa"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Resolve reachable deploy endpoint
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true'
        id: target
        run: |
          set -euo pipefail
          DEFAULT_HOST="69.62.98.126"
          HOSTS=()
          if [ -n "${{ secrets.VPS_HOST }}" ]; then HOSTS+=("${{ secrets.VPS_HOST }}"); fi
          HOSTS+=("${VPS_HOST}" "${DEFAULT_HOST}")
          PORTS=("${VPS_PORT}" "8022" "22" "2222")

          mapfile -t uniq_hosts < <(printf "%s\n" "${HOSTS[@]}" | awk 'NF' | awk '!seen[$0]++')
          mapfile -t uniq_ports < <(printf "%s\n" "${PORTS[@]}" | awk 'NF' | awk '!seen[$0]++')

          for host in "${uniq_hosts[@]}"; do
            for port in "${uniq_ports[@]}"; do
              echo "Trying ${VPS_USER}@${host}:${port}..."
              ssh-keyscan -p "$port" -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
              ssh_probe_opts=(
                -i ~/.ssh/deploy_key
                -p "$port"
                -o StrictHostKeyChecking=accept-new
                -o BatchMode=yes
                -o ConnectTimeout=8
                -o PubkeyAcceptedAlgorithms=+ssh-rsa
                -o HostKeyAlgorithms=+ssh-rsa
              )
              if ssh "${ssh_probe_opts[@]}" -4 "${VPS_USER}@${host}" "echo ok" >/dev/null 2>&1 || \
                 ssh "${ssh_probe_opts[@]}" "${VPS_USER}@${host}" "echo ok" >/dev/null 2>&1; then
                echo "host=${host}" >> "$GITHUB_OUTPUT"
                echo "port=${port}" >> "$GITHUB_OUTPUT"
                echo "✓ Selected endpoint ${host}:${port}"
                exit 0
              fi
            done
          done

          echo "::error::No reachable VPS endpoint found (hosts: ${uniq_hosts[*]} | ports: ${uniq_ports[*]})"
          exit 1

      - name: Validate resolved target inputs
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          RESOLVED_HOST="${{ steps.target.outputs.host }}"
          RESOLVED_PORT="${{ steps.target.outputs.port }}"
          RESOLVED_USER="${{ env.VPS_USER }}"
          RESOLVED_PATH="${{ env.DEPLOY_PATH }}"

          if [ -z "${RESOLVED_HOST}" ] || [ -z "${RESOLVED_PORT}" ] || [ -z "${RESOLVED_USER}" ] || [ -z "${RESOLVED_PATH}" ]; then
            echo "::error::Resolved deploy target is incomplete."
            exit 1
          fi
          if ! printf '%s' "${RESOLVED_HOST}" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            echo "::error::Resolved host has invalid characters: ${RESOLVED_HOST}"
            exit 1
          fi
          if ! printf '%s' "${RESOLVED_PORT}" | grep -Eq '^[0-9]{1,5}$'; then
            echo "::error::Resolved port is invalid: ${RESOLVED_PORT}"
            exit 1
          fi
          if [ "${RESOLVED_PORT}" -lt 1 ] || [ "${RESOLVED_PORT}" -gt 65535 ]; then
            echo "::error::Resolved port out of range: ${RESOLVED_PORT}"
            exit 1
          fi
          if ! printf '%s' "${RESOLVED_USER}" | grep -Eq '^[A-Za-z_][A-Za-z0-9_-]{0,31}$'; then
            echo "::error::Resolved user is invalid: ${RESOLVED_USER}"
            exit 1
          fi
          if ! printf '%s' "${RESOLVED_PATH}" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "::error::Resolved deploy path is invalid: ${RESOLVED_PATH}"
            exit 1
          fi
          if printf '%s' "${RESOLVED_PATH}" | grep -Eq '(^|/)\.\.(/|$)'; then
            echo "::error::Resolved deploy path contains path traversal segments: ${RESOLVED_PATH}"
            exit 1
          fi

      - name: Preflight target host
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          echo "▸ Deploy target: ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}:${{ steps.target.outputs.port }}"
          nc -vz -w 5 "${{ steps.target.outputs.host }}" "${{ steps.target.outputs.port }}" || echo "⚠️ TCP probe failed (continuing to SSH)"

      - name: Sync deploy scripts to VPS
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          sync_ok=false
          for attempt in 1 2 3; do
            if scp -i ~/.ssh/deploy_key -P ${{ steps.target.outputs.port }}               -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12               docker-compose.infra.yml               docker-compose.slot.yml               nginx.conf               scripts/deploy-bluegreen.sh               scripts/rollback-bluegreen.sh               scripts/health-dashboard.sh               scripts/vps-bootstrap-bluegreen.sh               ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}:${{ env.DEPLOY_PATH }}/; then
              sync_ok=true
              break
            fi
            sleep 3
          done

          if [ "${sync_ok}" != "true" ]; then
            echo "::warning::Failed to sync deploy scripts after 3 attempts; continuing with scripts already present on VPS"
          fi

          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }}             -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12             ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}             "mkdir -p ${{ env.DEPLOY_PATH }}/scripts ${{ env.DEPLOY_PATH }}/nginx &&              cp ${{ env.DEPLOY_PATH }}/deploy-bluegreen.sh ${{ env.DEPLOY_PATH }}/scripts/ 2>/dev/null || true &&              cp ${{ env.DEPLOY_PATH }}/rollback-bluegreen.sh ${{ env.DEPLOY_PATH }}/scripts/ 2>/dev/null || true &&              cp ${{ env.DEPLOY_PATH }}/health-dashboard.sh ${{ env.DEPLOY_PATH }}/scripts/ 2>/dev/null || true &&              cp ${{ env.DEPLOY_PATH }}/vps-bootstrap-bluegreen.sh ${{ env.DEPLOY_PATH }}/scripts/ 2>/dev/null || true &&              chmod +x ${{ env.DEPLOY_PATH }}/scripts/*.sh ${{ env.DEPLOY_PATH }}/deploy-bluegreen.sh 2>/dev/null || true"

          # Copy nginx static assets (maintenance page, custom error pages)
          scp -i ~/.ssh/deploy_key -P ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 \
            nginx/maintenance.html \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}:${{ env.DEPLOY_PATH }}/nginx/ 2>/dev/null || true

      - name: Run predeploy startup gate
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }}               -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ConnectionAttempts=3               -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes               ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}               "echo '${{ github.token }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null &&                cd ${{ env.DEPLOY_PATH }} &&                PREDEPLOY_ONLY='true'                IMAGE_TAG='${{ steps.tag.outputs.image_tag }}'                APP_VERSION='${{ steps.tag.outputs.app_version }}'                BUILD_IMAGE_TAG='${{ needs.build_images.outputs.image_tag }}'                EXPECTED_APP_DIGEST='${{ needs.build_images.outputs.app_digest }}'                EXPECTED_SANDBOX_DIGEST='${{ needs.build_images.outputs.sandbox_digest }}'                EXPECTED_OCR_DIGEST='${{ needs.build_images.outputs.ocr_digest }}'                bash scripts/deploy-bluegreen.sh"; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Predeploy startup gate failed after retry" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Run blue-green deploy
        id: deploy_bluegreen
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }}               -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ConnectionAttempts=3               -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes               ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}               "echo '${{ github.token }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null &&                cd ${{ env.DEPLOY_PATH }} &&                IMAGE_TAG='${{ steps.tag.outputs.image_tag }}'                APP_VERSION='${{ steps.tag.outputs.app_version }}'                BUILD_IMAGE_TAG='${{ needs.build_images.outputs.image_tag }}'                EXPECTED_APP_DIGEST='${{ needs.build_images.outputs.app_digest }}'                EXPECTED_SANDBOX_DIGEST='${{ needs.build_images.outputs.sandbox_digest }}'                EXPECTED_OCR_DIGEST='${{ needs.build_images.outputs.ocr_digest }}'                bash scripts/deploy-bluegreen.sh"; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Blue-green deploy failed after retry" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify production
        id: verify_production
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.tag.outputs.app_version }}"
          echo "▸ Verifying https://iliagpt.com is healthy after deploy (target version ${EXPECTED})..."
          for i in $(seq 1 20); do
            HEALTH_JSON="$(curl -sf --max-time 10 https://iliagpt.com/api/health 2>/dev/null || echo "{}")"
            if echo "${HEALTH_JSON}" | grep -q '"status":"ok"' && \
               echo "${HEALTH_JSON}" | grep -q '"version":"'; then
              echo "✓ Production health verified"
              echo "  ${HEALTH_JSON}"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "✗ Production health did not stabilize after deploy"
              echo "  Last response: ${HEALTH_JSON}"
              exit 1
            fi
            echo "  Attempt $i/20..."
            sleep 3
          done

          SW_CLEANUP="$(curl -sf --max-time 20 https://iliagpt.com/sw-cleanup.js || echo "")"
          if [ -n "${SW_CLEANUP}" ] && echo "${SW_CLEANUP}" | grep -q "var APP_VERSION = '${EXPECTED}';"; then
            echo "✓ sw-cleanup.js version matches: ${EXPECTED}"
          fi

          READY_CODE="$(curl -sf -o /dev/null -w '%{http_code}' --max-time 10 https://iliagpt.com/api/health/ready 2>/dev/null || echo "000")"
          if [ "${READY_CODE}" = "200" ]; then
            echo "✓ /api/health/ready → HTTP 200"
          else
            echo "⚠️ /api/health/ready → HTTP ${READY_CODE} (non-fatal)"
          fi
          # SSL + 5xx guardrails
          SSL_OK=$(echo | openssl s_client -servername iliagpt.com -connect iliagpt.com:443 2>/dev/null | grep -c "Verify return code: 0 (ok)" || true)
          if [ "${SSL_OK}" -lt 1 ]; then
            echo "::error::SSL verification failed for iliagpt.com"
            exit 1
          fi

          STATUS_CODE=$(curl -s -o /dev/null -w '%{http_code}' https://iliagpt.com/)
          if [ "${STATUS_CODE}" -ge 500 ]; then
            echo "::error::Production returned 5xx on root endpoint: ${STATUS_CODE}"
            exit 1
          fi

      - name: Checkout repository for browser smoke
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node for browser smoke
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install browser smoke dependencies
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser smoke against production
        id: browser_smoke
        if: steps.latest_main.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true'
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: https://iliagpt.com
        run: npm run test:smoke:remote

      - name: Run rigorous production acceptance checks
        id: prod_acceptance
        if: ${{ steps.latest_main.outputs.should_deploy == 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.browser_smoke.outcome == 'success' }}
        env:
          VPS_HOST: ${{ steps.target.outputs.host }}
          VPS_PORT: ${{ steps.target.outputs.port }}
          VPS_USER: ${{ env.VPS_USER }}
          VPS_SSH_KEY: /home/runner/.ssh/deploy_key
          EXPECTED_APP_VERSION: ${{ steps.tag.outputs.app_version }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DEPLOY_STATE_PATH: /opt/hola/deploy-state.json
          NGINX_UPSTREAM_CONF: /etc/nginx/conf.d/iliagpt-upstream.conf
        run: |
          bash scripts/prod-rigorous-checks.sh

      - name: Roll back on post-deploy acceptance failure
        if: ${{ always() && steps.latest_main.outputs.should_deploy == 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.deploy_bluegreen.outcome == 'success' && (steps.verify_production.outcome == 'failure' || steps.browser_smoke.outcome == 'failure' || steps.prod_acceptance.outcome == 'failure') }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }} \
            "cd ${{ env.DEPLOY_PATH }} && bash scripts/rollback-bluegreen.sh --force --stop-bad"

      - name: Enforce post-deploy acceptance
        if: ${{ always() && steps.latest_main.outputs.should_deploy == 'true' && steps.latest_main_cutover.outputs.should_deploy == 'true' && steps.production_state.outputs.already_deployed != 'true' && steps.deploy_bluegreen.outcome == 'success' }}
        run: |
          set -euo pipefail
          failed=0

          if [ "${{ steps.verify_production.outcome }}" = "failure" ]; then
            echo "::error::Public production verification failed."
            failed=1
          fi

          if [ "${{ steps.browser_smoke.outcome }}" = "failure" ]; then
            echo "::error::Browser smoke detected runtime regressions in production."
            failed=1
          fi

          if [ "${{ steps.prod_acceptance.outcome }}" = "failure" ]; then
            echo "::error::Rigorous production acceptance checks failed."
            failed=1
          fi

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy summary
        if: always()
        run: |
          echo "## Auto Deploy Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.tag.outputs.app_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ steps.tag.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | push(main) |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest Main SHA | \`${{ steps.latest_main_cutover.outputs.latest_sha || steps.latest_main.outputs.latest_sha || 'unknown' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Superseded | \`${{ steps.latest_main.outputs.should_deploy != 'true' || steps.latest_main_cutover.outputs.should_deploy == 'false' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Skip Reason | \`${{ steps.latest_main_cutover.outputs.skip_reason || steps.latest_main.outputs.skip_reason || 'n/a' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://iliagpt.com |" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Blue-green auto-deployment FAILED. Old slot should still be serving."
          echo "::error::Check state: ssh -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} 'cat /opt/hola/deploy-state.json'"
          echo "::error::Rollback: ssh -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} 'cd /opt/hola && bash scripts/rollback-bluegreen.sh --force'"
