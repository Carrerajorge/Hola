name: Diagnose Production (VPS)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST || '69.62.98.126' }}
  VPS_USER: ${{ secrets.VPS_USER || 'root' }}
  VPS_PORT: ${{ secrets.VPS_PORT || '8022' }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/hola' }}

jobs:
  diagnose:
    name: Collect VPS diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://iliagpt.com

    steps:
      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          {
            echo "Host *"
            echo "  StrictHostKeyChecking accept-new"
            echo "  PubkeyAcceptedKeyTypes +ssh-rsa"
            echo "  HostKeyAlgorithms +ssh-rsa"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Resolve reachable deploy endpoint
        id: target
        run: |
          set -euo pipefail
          DEFAULT_HOST="69.62.98.126"
          HOSTS=()
          if [ -n "${{ secrets.VPS_HOST }}" ]; then HOSTS+=("${{ secrets.VPS_HOST }}"); fi
          HOSTS+=("${VPS_HOST}" "${DEFAULT_HOST}")
          PORTS=("${VPS_PORT}" "8022" "22" "2222")

          mapfile -t uniq_hosts < <(printf "%s\n" "${HOSTS[@]}" | awk 'NF' | awk '!seen[$0]++')
          mapfile -t uniq_ports < <(printf "%s\n" "${PORTS[@]}" | awk 'NF' | awk '!seen[$0]++')

          for host in "${uniq_hosts[@]}"; do
            for port in "${uniq_ports[@]}"; do
              echo "Trying ${VPS_USER}@${host}:${port}..."
              ssh-keyscan -p "$port" -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
              ssh_probe_opts=(
                -i ~/.ssh/deploy_key
                -p "$port"
                -o StrictHostKeyChecking=accept-new
                -o BatchMode=yes
                -o ConnectTimeout=8
                -o PubkeyAcceptedAlgorithms=+ssh-rsa
                -o HostKeyAlgorithms=+ssh-rsa
              )
              if ssh "${ssh_probe_opts[@]}" -4 "${VPS_USER}@${host}" "echo ok" >/dev/null 2>&1 || \
                 ssh "${ssh_probe_opts[@]}" "${VPS_USER}@${host}" "echo ok" >/dev/null 2>&1; then
                echo "host=${host}" >> "$GITHUB_OUTPUT"
                echo "port=${port}" >> "$GITHUB_OUTPUT"
                echo "✓ Selected endpoint ${host}:${port}"
                exit 0
              fi
            done
          done

          echo "::error::No reachable VPS endpoint found (hosts: ${uniq_hosts[*]} | ports: ${uniq_ports[*]})"
          exit 1

      - name: Collect diagnostics
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o HostKeyAlgorithms=+ssh-rsa \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }} \
            "DEPLOY_PATH='${{ env.DEPLOY_PATH }}' bash -s" <<'ENDSSH'
          set -euo pipefail

          DEPLOY_PATH="${DEPLOY_PATH:-/opt/hola}"

          echo "=== host ==="
          hostname
          date -Is

          echo "=== deploy state ==="
          cat "${DEPLOY_PATH}/deploy-state.json" 2>/dev/null || echo "deploy-state.json missing"

          echo "=== nginx upstream ==="
          cat /etc/nginx/conf.d/iliagpt-upstream.conf 2>/dev/null || echo "upstream conf missing"

          echo "=== deploy lock ==="
          if [ -f "${DEPLOY_PATH}/.deploy.lock" ]; then
            ls -l "${DEPLOY_PATH}/.deploy.lock"
            cat "${DEPLOY_PATH}/.deploy.lock" 2>/dev/null || true
          else
            echo "no deploy lock"
          fi

          echo "=== container status ==="
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'hola-|iliagpt|NAMES' || true

          echo "=== local health checks ==="
          for port in 5000 5001; do
            echo "--- port ${port} /api/health ---"
            timeout 10 curl -sS -i "http://127.0.0.1:${port}/api/health" || true
            echo
            echo "--- port ${port} /api/health/ready ---"
            timeout 10 curl -sS -i "http://127.0.0.1:${port}/api/health/ready" || true
            echo
          done

          echo "=== active analyze probe ==="
          ACTIVE_SLOT="$(sed -n 's/.*"active_slot":[[:space:]]*"\([^"]*\)".*/\1/p' "${DEPLOY_PATH}/deploy-state.json" | head -n1)"
          ACTIVE_PORT="$(sed -n 's/.*"active_port":[[:space:]]*\([0-9][0-9]*\).*/\1/p' "${DEPLOY_PATH}/deploy-state.json" | head -n1)"
          APP_CONTAINER="hola-${ACTIVE_SLOT}-app"
          if [ -z "${ACTIVE_PORT}" ]; then
            ACTIVE_PORT="5001"
          fi
          if [ -z "${ACTIVE_SLOT}" ]; then
            ACTIVE_SLOT="green"
            APP_CONTAINER="hola-green-app"
          fi

          echo "active_slot=${ACTIVE_SLOT}"
          echo "active_port=${ACTIVE_PORT}"
          echo "app_container=${APP_CONTAINER}"

          TMPDIR="$(mktemp -d)"
          cleanup() {
            rm -rf "${TMPDIR}"
          }
          trap cleanup EXIT

          timeout 15 curl -sS -D "${TMPDIR}/csrf.headers" -c "${TMPDIR}/cookies" \
            "http://127.0.0.1:${ACTIVE_PORT}/api/csrf/token?rotate=1" \
            -o "${TMPDIR}/csrf.json" || true
          echo "--- csrf response ---"
          cat "${TMPDIR}/csrf.json" || true

          CSRF_TOKEN="$(grep -o '"csrfToken":"[^"]*"' "${TMPDIR}/csrf.json" | sed 's/.*:"\([^"]*\)"/\1/' | head -n1)"
          echo "csrf_token_present=$([ -n "${CSRF_TOKEN}" ] && echo yes || echo no)"

          cat > "${TMPDIR}/analyze-payload.json" <<'JSON'
          {
            "messages": [
              {
                "role": "user",
                "content": "dame un resumen"
              }
            ],
            "conversationId": "diag-analyze-inline",
            "attachments": [
              {
                "name": "diag-inline.txt",
                "mimeType": "text/plain",
                "type": "document",
                "content": "SG9sYS4gRXN0ZSBkb2N1bWVudG8gZXMgdW5hIHBydWViYSBtaW5pbWEgcGFyYSByZXByb2R1Y2lyIHVuIGVycm9yIDUwMCBlbiBlbCBhbmFsaXphZG8u"
              }
            ]
          }
          JSON

          ANALYZE_STATUS="$(
            timeout 30 curl -sS -b "${TMPDIR}/cookies" -c "${TMPDIR}/cookies" \
              -H "Content-Type: application/json" \
              -H "Origin: http://127.0.0.1:${ACTIVE_PORT}" \
              -H "X-CSRF-Token: ${CSRF_TOKEN}" \
              -H "X-Requested-With: XMLHttpRequest" \
              -D "${TMPDIR}/analyze.headers" \
              -o "${TMPDIR}/analyze.body" \
              -w "%{http_code}" \
              "http://127.0.0.1:${ACTIVE_PORT}/api/chat/analyze" \
              --data-binary "@${TMPDIR}/analyze-payload.json" || true
          )"

          echo "--- analyze status ---"
          echo "${ANALYZE_STATUS}"
          echo "--- analyze headers ---"
          cat "${TMPDIR}/analyze.headers" || true
          echo "--- analyze body ---"
          cat "${TMPDIR}/analyze.body" || true

          ANALYZE_REQUEST_ID="$(grep -o '"requestId":"[^"]*"' "${TMPDIR}/analyze.body" | sed 's/.*:"\([^"]*\)"/\1/' | head -n1)"
          echo "analyze_request_id=${ANALYZE_REQUEST_ID:-missing}"

          echo "=== active app recent logs ==="
          docker logs --since=5m "${APP_CONTAINER}" 2>&1 | tail -n 500 || true

          echo "=== active app filtered logs ==="
          FILTER_PATTERN='Analyze|APIErrorHandler|PARE_ERROR|TypeError|ReferenceError|RangeError|RESPONSE_CONTRACT|DATA_MODE_OUTPUT|diag-inline|diag-analyze-inline'
          if [ -n "${ANALYZE_REQUEST_ID}" ]; then
            FILTER_PATTERN="${FILTER_PATTERN}|${ANALYZE_REQUEST_ID}"
          fi
          docker logs --since=5m "${APP_CONTAINER}" 2>&1 | grep -nE "${FILTER_PATTERN}" || true

          echo "=== nginx error log tail ==="
          tail -n 80 /var/log/nginx/error.log 2>/dev/null || true

          echo "=== app inspect ==="
          for name in hola-blue-app hola-green-app; do
            echo "--- ${name} inspect ---"
            docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}} oom={{.State.OOMKilled}} error={{.State.Error}}' "${name}" 2>/dev/null || echo "${name} missing"
          done

          echo "=== blue app logs ==="
          docker logs --tail=200 hola-blue-app 2>&1 || true

          echo "=== green app logs ==="
          docker logs --tail=200 hola-green-app 2>&1 || true

          echo "=== worker logs ==="
          docker logs --tail=120 hola-blue-worker 2>&1 || true
          docker logs --tail=120 hola-green-worker 2>&1 || true
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
