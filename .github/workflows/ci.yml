name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

  python:
    name: Python Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile
        run: python -m compileall main.py fastapi_sse python_agent_tools

  ocr_service:
    name: OCR Service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: ~/.paddleocr
          key: paddleocr-${{ runner.os }}-${{ hashFiles('ocr_service/pyproject.toml') }}

      - name: Install system dependencies (Tesseract + fonts)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-spa \
            fonts-dejavu-core \
            libgomp1

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "ocr_service[dev,paddle]"

      - name: Run tests (coverage >= 95%)
        working-directory: ocr_service
        env:
          OCR_DEFAULT_LANG: eng
          # Deterministic in CI: prefer Tesseract for the real-OCR accuracy suite.
          OCR_PREFER_ENGINE: tesseract
        run: |
          set -euo pipefail
          pytest

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    if: always()
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Skip tests due to upstream dependency
        if: ${{ needs.typecheck.result != 'success' }}
        run: |
          echo "::notice::Skipping Unit Tests because Type Check result was `${{ needs.typecheck.result }}`."

      - name: Checkout
        uses: actions/checkout@v6
        if: ${{ needs.typecheck.result == 'success' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        if: ${{ needs.typecheck.result == 'success' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        if: ${{ needs.typecheck.result == 'success' }}

      - name: Run tests
        run: npm run test:run -- --silent --passWithNoTests
        if: ${{ needs.typecheck.result == 'success' }}
        env:
          CI: "true"
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          SESSION_SECRET: ci-session-secret-min-32-chars
          OPENAI_API_KEY: ci_dummy_key
          GEMINI_API_KEY: ci_dummy_key
          XAI_API_KEY: ci_dummy_key
          ANTHROPIC_API_KEY: ci_dummy_key

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 25
    steps:
      - name: Skip build due to upstream dependency
        if: ${{ needs.test.result != 'success' }}
        run: |
          echo "::notice::Skipping Build because Unit Tests result was `${{ needs.test.result }}`."

      - name: Checkout
        uses: actions/checkout@v6
        if: ${{ needs.test.result == 'success' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        if: ${{ needs.test.result == 'success' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        if: ${{ needs.test.result == 'success' }}

      - name: Build
        run: npm run build
        if: ${{ needs.test.result == 'success' }}
        env:
          NODE_ENV: production

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        if: ${{ needs.test.result == 'success' }}
        with:
          name: dist
          path: dist/
          retention-days: 7

  audit:
    name: Security Audit (npm)
    runs-on: ubuntu-latest
    needs: typecheck
    if: always()
    timeout-minutes: 20
    steps:
      - name: Skip audit due to upstream dependency
        if: ${{ needs.typecheck.result != 'success' }}
        run: |
          echo "::notice::Skipping Security Audit because Type Check result was `${{ needs.typecheck.result }}`."

      - name: Checkout
        uses: actions/checkout@v6
        if: ${{ needs.typecheck.result == 'success' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        if: ${{ needs.typecheck.result == 'success' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        if: ${{ needs.typecheck.result == 'success' }}

      - name: npm audit (high+)
        run: npm audit --omit=dev --audit-level=high
        if: ${{ needs.typecheck.result == 'success' }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    if: always()
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Evaluate E2E trigger
        id: e2e_gate
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip E2E due to upstream dependency
        if: ${{ needs.build.result != 'success' }}
        run: |
          echo "::notice::Skipping E2E because Build result was `${{ needs.build.result }}`."

      - name: Checkout
        if: ${{ steps.e2e_gate.outputs.should_run == 'true' && needs.build.result == 'success' }}
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: ${{ steps.e2e_gate.outputs.should_run == 'true' && needs.build.result == 'success' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: ${{ steps.e2e_gate.outputs.should_run == 'true' && needs.build.result == 'success' }}
        run: npm ci

      - name: Install Playwright browsers
        if: ${{ steps.e2e_gate.outputs.should_run == 'true' && needs.build.result == 'success' }}
        run: npx playwright install --with-deps

      - name: Run E2E tests
        if: ${{ steps.e2e_gate.outputs.should_run == 'true' && needs.build.result == 'success' }}
        run: npm run test:e2e
        env:
          CI: "true"
          NODE_ENV: test
          PORT: "5050"
          BASE_URL: "http://localhost:5050"
          DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e
          SESSION_SECRET: ci-e2e-session-secret
          OPENAI_API_KEY: ci_dummy_key
          GEMINI_API_KEY: ci_dummy_key
          XAI_API_KEY: ci_dummy_key
          ANTHROPIC_API_KEY: ci_dummy_key

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: steps.e2e_gate.outputs.should_run == 'true' && needs.build.result == 'success'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Skip E2E
        if: ${{ steps.e2e_gate.outputs.should_run != 'true' }}
        run: |
          echo "E2E intentionally skipped. Add label 'run-e2e' on the pull request to run Playwright."

  # Build/push container images so deploy workflows can pull by commit tag.
  docker:
    name: Docker Images
    needs: [build, audit]
    if: always()
    uses: ./.github/workflows/build-images.yml
    with:
      sha: ${{ github.sha }}
      allow_publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.typecheck.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' && needs.audit.result == 'success' }}
    permissions:
      contents: read
      packages: write

  ci-outcome:
    name: CI Outcome
    runs-on: ubuntu-latest
    needs: [typecheck, python, ocr_service, test, build, audit, e2e, docker]
    if: always()
    steps:
      - name: Publish deterministic run summary
        run: |
          typecheck_cause="executed"
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            typecheck_cause="failure in mandatory Type Check"
          fi

          python_cause="executed"
          if [[ "${{ needs.python.result }}" != "success" ]]; then
            python_cause="failure in Python Syntax job"
          fi

          ocr_cause="executed"
          if [[ "${{ needs.ocr_service.result }}" != "success" ]]; then
            ocr_cause="failure in OCR Service (Python)"
          fi

          tests_cause="executed"
          if [[ "${{ needs.typecheck.result }}" == "success" ]]; then
            tests_cause="executed after Type Check success"
          else
            tests_cause="intentionally skipped because Type Check was `${{ needs.typecheck.result }}`"
          fi

          build_cause="executed"
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            build_cause="executed after Unit Tests success"
          else
            build_cause="intentionally skipped because Unit Tests were `${{ needs.test.result }}`"
          fi

          audit_cause="executed"
          if [[ "${{ needs.typecheck.result }}" == "success" ]]; then
            audit_cause="executed after Type Check success"
          else
            audit_cause="intentionally skipped because Type Check was `${{ needs.typecheck.result }}`"
          fi

          e2e_run_label="${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e') }}"
          e2e_cause="intentionally skipped"
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            e2e_cause="blocked by Build result `${{ needs.build.result }}`"
          elif [[ "${{ github.event_name }}" != "pull_request" ]]; then
            e2e_cause="intentionally skipped (Playwright runs only on PRs with `run-e2e` label)"
          elif [[ "${e2e_run_label}" == "true" ]]; then
            e2e_cause="executed (`run-e2e` label detected)"
          else
            e2e_cause="intentionally skipped (`run-e2e` label not present)"
          fi

          docker_publish="${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.typecheck.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' && needs.audit.result == 'success' }}"
          docker_cause="skipped: publish gate disabled for this invocation"
          if [[ "${docker_publish}" == "true" ]]; then
            docker_cause="executed (publish gate allowed)"
          elif [[ "${{ needs.typecheck.result }}" == "success" && "${{ needs.test.result }}" == "success" && "${{ needs.build.result }}" == "success" && "${{ needs.audit.result }}" == "success" ]]; then
            docker_cause="intentionally skipped by publish gate (`build` job only)"
          else
            docker_cause="blocked by mandatory upstream dependency failure"
          fi

          echo "## CI Outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result | Cause |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Type Check | \`${{ needs.typecheck.result }}\` | ${typecheck_cause} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python Syntax | \`${{ needs.python.result }}\` | ${python_cause} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OCR Service (Python) | \`${{ needs.ocr_service.result }}\` | ${ocr_cause} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit Tests | \`${{ needs.test.result }}\` | ${tests_cause} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | \`${{ needs.build.result }}\` | ${build_cause} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Audit | \`${{ needs.audit.result }}\` | ${audit_cause} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| E2E (Playwright) | \`${{ needs.e2e.result }}\` | ${e2e_cause} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Images | \`${{ needs.docker.result }}\` | ${docker_cause} |" >> "$GITHUB_STEP_SUMMARY"

          FINAL_OUTCOME="success"
          FAILURE_CAUSES=""

          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            FINAL_OUTCOME="failure"
            FAILURE_CAUSES="${FAILURE_CAUSES}\n- Type Check result was \`${{ needs.typecheck.result }}\`."
          fi

          if [[ "${{ needs.python.result }}" != "success" ]]; then
            FINAL_OUTCOME="failure"
            FAILURE_CAUSES="${FAILURE_CAUSES}\n- Python Syntax result was \`${{ needs.python.result }}\`."
          fi

          if [[ "${{ needs.ocr_service.result }}" != "success" ]]; then
            FINAL_OUTCOME="failure"
            FAILURE_CAUSES="${FAILURE_CAUSES}\n- OCR Service (Python) result was \`${{ needs.ocr_service.result }}\`."
          fi

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            FINAL_OUTCOME="failure"
            FAILURE_CAUSES="${FAILURE_CAUSES}\n- Unit Tests result was \`${{ needs.test.result }}\`."
          fi

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            FINAL_OUTCOME="failure"
            FAILURE_CAUSES="${FAILURE_CAUSES}\n- Build result was \`${{ needs.build.result }}\`."
          fi

          if [[ "${{ needs.audit.result }}" != "success" ]]; then
            FINAL_OUTCOME="failure"
            FAILURE_CAUSES="${FAILURE_CAUSES}\n- Security Audit result was \`${{ needs.audit.result }}\`."
          fi

          if [[ "${{ needs.e2e.result }}" != "success" && "${{ needs.e2e.result }}" != "skipped" ]]; then
            FINAL_OUTCOME="failure"
            FAILURE_CAUSES="${FAILURE_CAUSES}\n- E2E (Playwright) result was \`${{ needs.e2e.result }}\`."
          fi

          if [[ "${{ needs.docker.result }}" != "success" && "${{ needs.docker.result }}" != "skipped" ]]; then
            FINAL_OUTCOME="failure"
            FAILURE_CAUSES="${FAILURE_CAUSES}\n- Docker Images result was \`${{ needs.docker.result }}\`."
          fi

          echo "| Final outcome | \`${FINAL_OUTCOME}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${FINAL_OUTCOME}" = "failure" ]; then
            echo "| Failure causes | <br>$(printf "%s" "${FAILURE_CAUSES}") |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Failure causes | \`none\` |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${FINAL_OUTCOME}" != "success" ]; then
            exit 1
          fi
