name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Type check
        run: npm run type-check

  python:
    name: Python Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile
        run: python -m compileall main.py fastapi_sse python_agent_tools

  ocr_service:
    name: OCR Service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: ~/.paddleocr
          key: paddleocr-${{ runner.os }}-${{ hashFiles('ocr_service/pyproject.toml') }}

      - name: Install system dependencies (Tesseract + fonts)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-spa \
            fonts-dejavu-core \
            libgomp1

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "ocr_service[dev,paddle]"

      - name: Run tests (coverage >= 95%)
        working-directory: ocr_service
        env:
          OCR_DEFAULT_LANG: eng
          # Deterministic in CI: prefer Tesseract for the real-OCR accuracy suite.
          OCR_PREFER_ENGINE: tesseract
        run: |
          set -euo pipefail
          pytest

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Run tests
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            npm run test:run -- --silent --passWithNoTests && break
            if [ "$attempt" -eq 2 ]; then
              echo "Unit tests failed after retry" >&2
              exit 1
            fi
            sleep 10
          done
        env:
          CI: "true"
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          SESSION_SECRET: ci-session-secret-min-32-chars
          OPENAI_API_KEY: ci_dummy_key
          GEMINI_API_KEY: ci_dummy_key
          XAI_API_KEY: ci_dummy_key
          ANTHROPIC_API_KEY: ci_dummy_key

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Build
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            npm run build && break
            if [ "$attempt" -eq 2 ]; then
              echo "Build failed after retry" >&2
              exit 1
            fi
            sleep 10
          done
        env:
          NODE_ENV: production

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 7

  quality-gate:
    name: Quality Gate
    needs: [typecheck, test, build, audit]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Run Hardening + Coverage Gate
        env:
          CI: "true"
          NODE_ENV: "test"
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          SESSION_SECRET: ci-session-secret-min-32-chars
          OPENAI_API_KEY: ci_dummy_key
          GEMINI_API_KEY: ci_dummy_key
          XAI_API_KEY: ci_dummy_key
          ANTHROPIC_API_KEY: ci_dummy_key
          # Quality gate aligned to ISO-25010 operability/security targets.
          QUALITY_GATE_LINES: "90"
          QUALITY_GATE_STATEMENTS: "90"
          QUALITY_GATE_FUNCTIONS: "90"
          QUALITY_GATE_BRANCHES: "90"
        run: |
          set -euo pipefail
          npm run quality:gate

      - name: Upload quality gate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-gate-report
          path: test_results/quality-gate-report.json
          retention-days: 14

  audit:
    name: Security Audit (npm)
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: npm audit (high+)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Evaluate E2E trigger
        id: e2e_gate
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: ${{ steps.e2e_gate.outputs.should_run == 'true' }}
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: ${{ steps.e2e_gate.outputs.should_run == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: ${{ steps.e2e_gate.outputs.should_run == 'true' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Install Playwright browsers
        if: ${{ steps.e2e_gate.outputs.should_run == 'true' }}
        run: npx playwright install --with-deps

      - name: Run E2E tests
        if: ${{ steps.e2e_gate.outputs.should_run == 'true' }}
        run: npm run test:e2e
        env:
          CI: "true"
          NODE_ENV: test
          PORT: "5050"
          BASE_URL: "http://localhost:5050"
          DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e
          SESSION_SECRET: ci-e2e-session-secret
          OPENAI_API_KEY: ci_dummy_key
          GEMINI_API_KEY: ci_dummy_key
          XAI_API_KEY: ci_dummy_key
          ANTHROPIC_API_KEY: ci_dummy_key

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always() && steps.e2e_gate.outputs.should_run == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Skip E2E
        if: ${{ steps.e2e_gate.outputs.should_run != 'true' }}
        run: |
          echo "E2E intentionally skipped. Add label 'run-e2e' on the pull request to run Playwright."

  # Build/push container images so deploy workflows can pull by commit tag.
  docker:
    name: Docker Images
    needs: [build, audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/build-images.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read
      packages: write
