name: Rollback Production (Blue-Green)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "ROLLBACK" to confirm'
        required: true
        default: ''
        type: string
      stop_bad_slot:
        description: 'Also stop the bad slot after rollback?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read
  actions: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST || '69.62.98.126' }}
  VPS_USER: ${{ secrets.VPS_USER || 'root' }}
  VPS_PORT: ${{ secrets.VPS_PORT || '8022' }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/hola' }}

jobs:
  rollback:
    name: Rollback to Previous Slot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://iliagpt.com

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "ROLLBACK" ]; then
            echo "::error::Confirmation required. Type ROLLBACK to proceed."
            exit 1
          fi
          echo "Confirmation received. Proceeding with rollback..."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          {
            echo "Host *"
            echo "  StrictHostKeyChecking accept-new"
            echo "  PubkeyAcceptedKeyTypes +ssh-rsa"
            echo "  HostKeyAlgorithms +ssh-rsa"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Resolve reachable deploy endpoint
        id: target
        run: |
          set -euo pipefail
          DEFAULT_HOST="69.62.98.126"
          HOSTS=()
          if [ -n "${{ secrets.VPS_HOST }}" ]; then HOSTS+=("${{ secrets.VPS_HOST }}"); fi
          HOSTS+=("${VPS_HOST}" "${DEFAULT_HOST}")
          PORTS=("${VPS_PORT}" "8022" "22" "2222")

          mapfile -t uniq_hosts < <(printf "%s\n" "${HOSTS[@]}" | awk 'NF' | awk '!seen[$0]++')
          mapfile -t uniq_ports < <(printf "%s\n" "${PORTS[@]}" | awk 'NF' | awk '!seen[$0]++')

          for host in "${uniq_hosts[@]}"; do
            for port in "${uniq_ports[@]}"; do
              echo "Trying ${VPS_USER}@${host}:${port}..."
              ssh-keyscan -p "$port" -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
              ssh_probe_opts=(
                -i ~/.ssh/deploy_key
                -p "$port"
                -o StrictHostKeyChecking=accept-new
                -o BatchMode=yes
                -o ConnectTimeout=8
                -o PubkeyAcceptedAlgorithms=+ssh-rsa
                -o HostKeyAlgorithms=+ssh-rsa
              )
              if ssh "${ssh_probe_opts[@]}" -4 "${VPS_USER}@${host}" "echo ok" >/dev/null 2>&1 || \
                 ssh "${ssh_probe_opts[@]}" "${VPS_USER}@${host}" "echo ok" >/dev/null 2>&1; then
                echo "host=${host}" >> "$GITHUB_OUTPUT"
                echo "port=${port}" >> "$GITHUB_OUTPUT"
                echo "✓ Selected endpoint ${host}:${port}"
                exit 0
              fi
            done
          done

          echo "::error::No reachable VPS endpoint found (hosts: ${uniq_hosts[*]} | ports: ${uniq_ports[*]})"
          exit 1

      - name: Sync rollback assets to VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=12 \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o HostKeyAlgorithms=+ssh-rsa \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }} \
            "mkdir -p ${{ env.DEPLOY_PATH }}/scripts"

          scp -i ~/.ssh/deploy_key -P ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=12 \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o HostKeyAlgorithms=+ssh-rsa \
            docker-compose.slot.yml \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}:${{ env.DEPLOY_PATH }}/docker-compose.slot.yml

          scp -i ~/.ssh/deploy_key -P ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=12 \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o HostKeyAlgorithms=+ssh-rsa \
            scripts/rollback-bluegreen.sh \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}:${{ env.DEPLOY_PATH }}/scripts/rollback-bluegreen.sh

          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=12 \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o HostKeyAlgorithms=+ssh-rsa \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }} \
            "chmod +x ${{ env.DEPLOY_PATH }}/scripts/rollback-bluegreen.sh"

      - name: Execute rollback
        run: |
          set -euo pipefail
          STOP_FLAG=""
          if [ "${{ github.event.inputs.stop_bad_slot }}" = "true" ]; then
            STOP_FLAG="--stop-bad"
          fi

          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o HostKeyAlgorithms=+ssh-rsa \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }} \
            "cd ${{ env.DEPLOY_PATH }} && bash scripts/rollback-bluegreen.sh --force ${STOP_FLAG}"

      - name: Verify rollback
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o HostKeyAlgorithms=+ssh-rsa \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }} \
            "cat ${{ env.DEPLOY_PATH }}/deploy-state.json 2>/dev/null | python3 -c 'import json,sys; s=json.load(sys.stdin); print(\"Active slot:\", s[\"active_slot\"], \"port\", s[\"active_port\"], \"version:\", s[\"app_version\"])'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Rollback summary
        if: always()
        run: |
          echo "## Rollback Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stop bad slot | ${{ github.event.inputs.stop_bad_slot }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://iliagpt.com |" >> $GITHUB_STEP_SUMMARY
