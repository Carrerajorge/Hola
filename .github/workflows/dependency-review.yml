name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        id: dep_review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high

      - name: Note (Dependency graph not enabled)
        if: ${{ steps.dep_review.outcome == 'failure' }}
        run: |
          echo "Dependency review failed. This commonly happens when GitHub Dependency graph is disabled for the repo."
          echo "Enable it in Settings → Security & analysis → Dependency graph (requires admin access)."

