name: Emergency Build And Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm'
        required: true
        default: ""
        type: string

permissions:
  contents: read
  packages: write

env:
  VPS_HOST: ${{ secrets.VPS_HOST || '69.62.98.126' }}
  VPS_USER: ${{ secrets.VPS_USER || 'root' }}
  VPS_PORT: ${{ secrets.VPS_PORT || '8022' }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/hola' }}

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Validate confirmation
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Confirmation required. Type DEPLOY to proceed."
            exit 1
          fi

      - name: Compute metadata
        id: meta
        run: |
          set -euo pipefail
          echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

  build_images:
    name: Build Docker Images
    needs: validate
    uses: ./.github/workflows/build-images.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  deploy:
    name: Deploy built images to production
    runs-on: ubuntu-latest
    needs: [validate, build_images]
    timeout-minutes: 25
    environment:
      name: production
      url: https://iliagpt.com

    steps:
      - name: Fetch deployment assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail

          fetch_asset() {
            local asset_path="$1"
            mkdir -p "$(dirname "${asset_path}")"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${REPO}/contents/${asset_path}?ref=${REF}" \
              -o "${asset_path}"
          }

          for asset in \
            docker-compose.infra.yml \
            docker-compose.slot.yml \
            nginx.conf \
            nginx/maintenance.html \
            scripts/deploy-bluegreen.sh \
            scripts/rollback-bluegreen.sh \
            scripts/health-dashboard.sh \
            scripts/vps-bootstrap-bluegreen.sh \
            scripts/prod-rigorous-checks.sh \
            scripts/verify-public-runtime-contract.mjs
          do
            fetch_asset "${asset}"
          done

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          {
            echo "Host *"
            echo "  StrictHostKeyChecking accept-new"
            echo "  PubkeyAcceptedKeyTypes +ssh-rsa"
            echo "  HostKeyAlgorithms +ssh-rsa"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Resolve reachable deploy endpoint
        id: target
        run: |
          set -euo pipefail
          DEFAULT_HOST="69.62.98.126"
          HOSTS=()
          if [ -n "${{ secrets.VPS_HOST }}" ]; then HOSTS+=("${{ secrets.VPS_HOST }}"); fi
          HOSTS+=("${VPS_HOST}" "${DEFAULT_HOST}")
          PORTS=("${VPS_PORT}" "8022" "22" "2222")

          mapfile -t uniq_hosts < <(printf "%s\n" "${HOSTS[@]}" | awk 'NF' | awk '!seen[$0]++')
          mapfile -t uniq_ports < <(printf "%s\n" "${PORTS[@]}" | awk 'NF' | awk '!seen[$0]++')

          for host in "${uniq_hosts[@]}"; do
            for port in "${uniq_ports[@]}"; do
              echo "Trying ${VPS_USER}@${host}:${port}..."
              ssh-keyscan -p "$port" -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
              ssh_probe_opts=(
                -i ~/.ssh/deploy_key
                -p "$port"
                -o StrictHostKeyChecking=accept-new
                -o BatchMode=yes
                -o ConnectTimeout=8
                -o PubkeyAcceptedAlgorithms=+ssh-rsa
                -o HostKeyAlgorithms=+ssh-rsa
              )
              if ssh "${ssh_probe_opts[@]}" -4 "${VPS_USER}@${host}" "echo ok" >/dev/null 2>&1 || \
                 ssh "${ssh_probe_opts[@]}" "${VPS_USER}@${host}" "echo ok" >/dev/null 2>&1; then
                echo "host=${host}" >> "$GITHUB_OUTPUT"
                echo "port=${port}" >> "$GITHUB_OUTPUT"
                echo "Selected endpoint ${host}:${port}"
                exit 0
              fi
            done
          done

          echo "::error::No reachable VPS endpoint found"
          exit 1

      - name: Sync deploy scripts to VPS
        run: |
          set -euo pipefail

          scp -i ~/.ssh/deploy_key -P ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 \
            docker-compose.infra.yml \
            docker-compose.slot.yml \
            nginx.conf \
            scripts/deploy-bluegreen.sh \
            scripts/rollback-bluegreen.sh \
            scripts/health-dashboard.sh \
            scripts/vps-bootstrap-bluegreen.sh \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}:${{ env.DEPLOY_PATH }}/

          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }} \
            "mkdir -p ${{ env.DEPLOY_PATH }}/scripts ${{ env.DEPLOY_PATH }}/nginx && \
             cp ${{ env.DEPLOY_PATH }}/deploy-bluegreen.sh ${{ env.DEPLOY_PATH }}/scripts/ 2>/dev/null || true && \
             cp ${{ env.DEPLOY_PATH }}/rollback-bluegreen.sh ${{ env.DEPLOY_PATH }}/scripts/ 2>/dev/null || true && \
             cp ${{ env.DEPLOY_PATH }}/health-dashboard.sh ${{ env.DEPLOY_PATH }}/scripts/ 2>/dev/null || true && \
             cp ${{ env.DEPLOY_PATH }}/vps-bootstrap-bluegreen.sh ${{ env.DEPLOY_PATH }}/scripts/ 2>/dev/null || true && \
             chmod +x ${{ env.DEPLOY_PATH }}/scripts/*.sh ${{ env.DEPLOY_PATH }}/deploy-bluegreen.sh 2>/dev/null || true"

          scp -i ~/.ssh/deploy_key -P ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 \
            nginx/maintenance.html \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }}:${{ env.DEPLOY_PATH }}/nginx/

      - name: Run blue-green deploy for built tag
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ConnectionAttempts=3 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }} \
            "echo '${{ github.token }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null && \
             cd ${{ env.DEPLOY_PATH }} && \
             IMAGE_TAG='${{ needs.build_images.outputs.image_tag }}' \
             APP_VERSION='${{ needs.validate.outputs.short_sha }}' \
             bash -s" < scripts/deploy-bluegreen.sh

      - name: Verify production
        run: |
          set -euo pipefail
          EXPECTED="${{ needs.validate.outputs.short_sha }}"
          echo "Verifying https://iliagpt.com (expecting version ${EXPECTED})..."
          for i in $(seq 1 20); do
            HEALTH_JSON="$(curl -sf --max-time 10 https://iliagpt.com/api/health 2>/dev/null || echo '{}')"
            if echo "${HEALTH_JSON}" | grep -q "\"version\":\"${EXPECTED}\""; then
              echo "Production verified: version ${EXPECTED}"
              echo "${HEALTH_JSON}"
              exit 0
            fi
            echo "Attempt ${i}/20..."
            sleep 3
          done

          echo "::error::Production version mismatch after emergency deploy"
          curl -sS https://iliagpt.com/api/health || true
          exit 1

      - name: Checkout repository for post-deploy acceptance
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node for post-deploy acceptance
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install post-deploy acceptance dependencies
        run: npm ci

      - name: Run rigorous production acceptance checks
        id: prod_acceptance
        continue-on-error: true
        env:
          VPS_HOST: ${{ steps.target.outputs.host }}
          VPS_PORT: ${{ steps.target.outputs.port }}
          VPS_USER: ${{ env.VPS_USER }}
          VPS_SSH_KEY: /home/runner/.ssh/deploy_key
          EXPECTED_APP_VERSION: ${{ needs.validate.outputs.short_sha }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DEPLOY_STATE_PATH: /opt/hola/deploy-state.json
          NGINX_UPSTREAM_CONF: /etc/nginx/conf.d/iliagpt-upstream.conf
        run: |
          bash scripts/prod-rigorous-checks.sh

      - name: Run production artifact-safety regressions
        id: artifact_safety
        continue-on-error: true
        env:
          BASE_URL: https://iliagpt.com
        run: npm run test:prod:artifact-safety

      - name: Roll back on post-deploy acceptance failure
        if: ${{ always() && (steps.prod_acceptance.outcome == 'failure' || steps.artifact_safety.outcome == 'failure') }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }} \
            "cd ${{ env.DEPLOY_PATH }} && bash scripts/rollback-bluegreen.sh --force --stop-bad"

      - name: Enforce post-deploy acceptance
        if: always()
        run: |
          set -euo pipefail
          failed=0

          if [ "${{ steps.prod_acceptance.outcome }}" = "failure" ]; then
            echo "::error::Rigorous production acceptance checks failed."
            failed=1
          fi

          if [ "${{ steps.artifact_safety.outcome }}" = "failure" ]; then
            echo "::error::Artifact-safety regressions detected in production."
            failed=1
          fi

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
