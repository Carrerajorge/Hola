name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4

      - name: Emit CodeQL summary
        if: always()
        run: |
          echo "## CodeQL Outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Checkout | \`${{ steps.checkout.conclusion }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Initialize CodeQL | \`${{ steps.init.conclusion }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Analyze | \`${{ steps.analyze.conclusion }}\` |" >> "$GITHUB_STEP_SUMMARY"
