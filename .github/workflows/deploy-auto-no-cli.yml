name: Auto Deploy (no local CLI needed)

on:
  push:
    branches:
      - deploy/iliacodex-import
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'deploy/iliacodex-import'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '69.62.98.126' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '2222' }}
      VPS_DIR: ${{ secrets.DEPLOY_PATH || '/root/ILIACODEX' }}
      DEPLOY_BRANCH: ${{ inputs.branch || 'deploy/iliacodex-import' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Missing VPS_SSH_KEY secret"
            exit 1
          fi
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${VPS_PORT} -H ${VPS_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to production VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p ${VPS_PORT} -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} 'bash -s' <<'DEPLOY'
          set -euo pipefail

          TARGET_DIR="${VPS_DIR}"
          BRANCH="${DEPLOY_BRANCH}"
          REPO="https://github.com/Carrerajorge/Hola.git"

          if [ ! -d "$TARGET_DIR/.git" ]; then
            mkdir -p "$(dirname "$TARGET_DIR")"
            git clone "$REPO" "$TARGET_DIR"
          fi

          cd "$TARGET_DIR"
          git fetch origin
          git checkout "$BRANCH"
          git pull origin "$BRANCH"

          # Deploy directly on VPS (no rsync/remote loop)
          export LOCAL_DEPLOY=1
          export VPS_PORT=${VPS_PORT}
          export DEPLOY_BRANCH="$BRANCH"
          VPS_DIR="$TARGET_DIR"
          ./deploy_direct.sh

          # Quick smoke-check
          if ! curl -fsS https://iliagpt.com/api/health >/dev/null; then
            echo "Health check failed"
            exit 1
          fi

          echo "✅ Deploy auto completado"
          DEPLOY

      - name: Report
        if: always()
        run: |
          echo "Done"
