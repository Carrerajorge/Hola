name: Emergency Disk Recovery & Restart

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "RECOVER" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST || '69.62.98.126' }}
  VPS_USER: ${{ secrets.VPS_USER || 'root' }}
  VPS_PORT: ${{ secrets.VPS_PORT || '8022' }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/hola' }}

jobs:
  recover:
    name: Free disk and recover active slot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://iliagpt.com

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RECOVER" ]; then
            echo "::error::Confirmation required. Type RECOVER to proceed."
            exit 1
          fi

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          {
            echo "Host *"
            echo "  StrictHostKeyChecking accept-new"
            echo "  PubkeyAcceptedKeyTypes +ssh-rsa"
            echo "  HostKeyAlgorithms +ssh-rsa"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Resolve reachable deploy endpoint
        id: target
        run: |
          set -euo pipefail
          DEFAULT_HOST="69.62.98.126"
          HOSTS=()
          if [ -n "${{ secrets.VPS_HOST }}" ]; then HOSTS+=("${{ secrets.VPS_HOST }}"); fi
          HOSTS+=("${VPS_HOST}" "${DEFAULT_HOST}")
          PORTS=("${VPS_PORT}" "8022" "22" "2222")

          mapfile -t uniq_hosts < <(printf "%s\n" "${HOSTS[@]}" | awk 'NF' | awk '!seen[$0]++')
          mapfile -t uniq_ports < <(printf "%s\n" "${PORTS[@]}" | awk 'NF' | awk '!seen[$0]++')

          for host in "${uniq_hosts[@]}"; do
            for port in "${uniq_ports[@]}"; do
              echo "Trying ${VPS_USER}@${host}:${port}..."
              ssh-keyscan -p "$port" -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
              ssh_probe_opts=(
                -i ~/.ssh/deploy_key
                -p "$port"
                -o StrictHostKeyChecking=accept-new
                -o BatchMode=yes
                -o ConnectTimeout=8
                -o PubkeyAcceptedAlgorithms=+ssh-rsa
                -o HostKeyAlgorithms=+ssh-rsa
              )
              if ssh "${ssh_probe_opts[@]}" -4 "${VPS_USER}@${host}" "echo ok" >/dev/null 2>&1 || \
                 ssh "${ssh_probe_opts[@]}" "${VPS_USER}@${host}" "echo ok" >/dev/null 2>&1; then
                echo "host=${host}" >> "$GITHUB_OUTPUT"
                echo "port=${port}" >> "$GITHUB_OUTPUT"
                echo "✓ Selected endpoint ${host}:${port}"
                exit 0
              fi
            done
          done

          echo "::error::No reachable VPS endpoint found (hosts: ${uniq_hosts[*]} | ports: ${uniq_ports[*]})"
          exit 1

      - name: Free disk and recover services
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o HostKeyAlgorithms=+ssh-rsa \
            ${{ env.VPS_USER }}@${{ steps.target.outputs.host }} \
            "DEPLOY_PATH='${{ env.DEPLOY_PATH }}' bash -s" <<'ENDSSH'
          set -euo pipefail

          DEPLOY_PATH="${DEPLOY_PATH:-/opt/hola}"
          STATE_FILE="${DEPLOY_PATH}/deploy-state.json"
          SLOT_COMPOSE="${DEPLOY_PATH}/docker-compose.slot.yml"

          extract_env_value() {
            local file="$1"
            local key="$2"
            local line
            line="$(grep -m1 -E "^${key}=" "$file" 2>/dev/null || true)"
            if [ -z "$line" ]; then
              return 1
            fi
            line="${line#*=}"
            line="${line%$'\r'}"
            line="${line%\"}"
            line="${line#\"}"
            line="${line%\'}"
            line="${line#\'}"
            echo "$line"
          }

          if [ ! -f "${STATE_FILE}" ]; then
            echo "ERROR: state file not found"
            exit 1
          fi

          ACTIVE_SLOT="$(python3 -c "import json; d=json.load(open('${STATE_FILE}')); print(d['active_slot'])")"
          ACTIVE_PORT="$(python3 -c "import json; d=json.load(open('${STATE_FILE}')); print(d['active_port'])")"
          IMAGE_TAG="$(python3 -c "import json; d=json.load(open('${STATE_FILE}')); print(d.get('image_tag','latest'))")"
          APP_VERSION="$(python3 -c "import json; d=json.load(open('${STATE_FILE}')); print(d.get('app_version',''))")"

          echo "=== before cleanup ==="
          df -h "${DEPLOY_PATH}" || true
          docker system df || true

          echo "=== freeing disk ==="
          docker container prune -f || true
          docker image prune -af || true
          docker builder prune -af || true
          find /var/lib/docker/containers -type f -name '*-json.log' -exec truncate -s 0 {} + 2>/dev/null || true
          journalctl --vacuum-size=200M || true
          apt-get clean || true
          rm -rf /tmp/* /var/tmp/* 2>/dev/null || true

          echo "=== after cleanup ==="
          df -h "${DEPLOY_PATH}" || true
          docker system df || true

          echo "=== restarting stateful services ==="
          docker restart hola-redis || true
          docker restart hola-postgres || true

          echo "=== recreating active slot ${ACTIVE_SLOT} ==="
          cd "${DEPLOY_PATH}"
          SANDBOX_RUNNER_TOKEN="$(extract_env_value .env.production SANDBOX_RUNNER_TOKEN || true)"
          REDIS_PASSWORD="$(extract_env_value .env.production REDIS_PASSWORD || true)"
          timeout 30 docker rm -f \
            "hola-${ACTIVE_SLOT}-app" \
            "hola-${ACTIVE_SLOT}-worker" \
            "hola-${ACTIVE_SLOT}-sandbox" >/dev/null 2>&1 || true

          SLOT="${ACTIVE_SLOT}" \
          HOST_PORT="${ACTIVE_PORT}" \
          IMAGE_TAG="${IMAGE_TAG}" \
          APP_VERSION="${APP_VERSION}" \
          SANDBOX_RUNNER_TOKEN="${SANDBOX_RUNNER_TOKEN}" \
          REDIS_PASSWORD="${REDIS_PASSWORD}" \
            timeout 180 docker compose -p "hola-${ACTIVE_SLOT}" -f "${SLOT_COMPOSE}" up -d --force-recreate app worker sandbox-runner

          echo "=== waiting for local readiness ==="
          for i in $(seq 1 36); do
            HTTP_CODE="$(curl -sf -o /dev/null -w '%{http_code}' "http://127.0.0.1:${ACTIVE_PORT}/api/health/ready" 2>/dev/null || echo "000")"
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "Local readiness OK on attempt ${i}"
              break
            fi
            echo "Attempt ${i}/36 local readiness HTTP ${HTTP_CODE}"
            sleep 5
          done

          echo "=== final status ==="
          df -h "${DEPLOY_PATH}" || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'hola-|iliagpt|NAMES' || true
          curl -sS -i "http://127.0.0.1:${ACTIVE_PORT}/api/health" || true
          curl -sS -i "http://127.0.0.1:${ACTIVE_PORT}/api/health/ready" || true
          ENDSSH

      - name: Check production health
        run: |
          sleep 5
          HTTP_CODE="$(curl -sf -o /dev/null -w '%{http_code}' https://iliagpt.com/api/health 2>/dev/null || echo "000")"
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✓ Production is healthy (HTTP ${HTTP_CODE})"
          else
            echo "✗ Production health check returned HTTP ${HTTP_CODE}"
            exit 1
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
