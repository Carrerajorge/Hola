name: codeql-config

queries:
  - uses: security-and-quality

paths:
  - client
  - server
  - shared
  - scripts
  - tests

paths-ignore:
  - node_modules
  - dist
  - "**/node_modules/**"
  - "**/dist/**"
  - artifacts
  - docs
  - ocr_service
  - fastapi_sse
  - python_agent_tools
  - migrations
  - server/openclaw/**
  - "**/*.min.js"
  - "**/*.snap"
