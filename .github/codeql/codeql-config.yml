name: codeql-config

queries:
  - uses: security-extended

paths:
  - client
  - server
  - shared
  - scripts
  - tests

paths-ignore:
  - node_modules
  - dist
  - "**/node_modules/**"
  - "**/dist/**"
  - artifacts
  - docs
  - ocr_service
  - fastapi_sse
  - python_agent_tools
  - migrations
  - client/public/**
  - server/openclaw/**
  - server/local-runner/**
  - server/services/superIntelligence/**
  - server/services/**/docs/**
  - server/services/**/test/**
  - server/services/**/test-helpers/**
  - server/services/**/__tests__/**
  - "**/*.min.js"
  - "**/*.snap"
