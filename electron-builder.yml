appId: com.michat.superintelligence
productName: MICHAT Workspace

directories:
  output: release
  buildResources: build

files:
  - "dist/**/*"
  - "desktop/dist/**/*"
  - "!node_modules/**/*"
  - "node_modules/@clickhouse/**/*"
  - "native/index.node"

mac:
  target: ["dmg"]
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  sign: false # User bypassed cert requirements for initial test
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target: ["nsis"]
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true

publish:
  provider: github
  owner: ale
  repo: michat-superintelligence
