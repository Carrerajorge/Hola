# PostgreSQL Host-Based Authentication override for Docker deployment.
# Mounted at /etc/postgresql/pg_hba_override.conf and referenced via
# the -c hba_file=... postgres command-line argument so that it takes
# precedence over the data-directory pg_hba.conf (which may only have
# hostssl entries after upgrades, breaking Docker-internal traffic).
#
# TYPE  DATABASE  USER  ADDRESS            METHOD
local   all       all                      trust
host    all       all   127.0.0.1/32       scram-sha-256
host    all       all   ::1/128            scram-sha-256
host    all       all   0.0.0.0/0          scram-sha-256
host    all       all   ::/0               scram-sha-256
hostssl all       all   0.0.0.0/0          scram-sha-256
hostssl all       all   ::/0               scram-sha-256
