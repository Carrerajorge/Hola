# pg_hba.conf — allow all Docker-network connections (SSL optional)
# Mounted into the postgres container via docker-compose.infra.yml
# so that application containers on the hola-net bridge network can
# connect without SSL (they communicate over an internal bridge).

# TYPE  DATABASE  USER  ADDRESS         METHOD

# Unix socket connections (local)
local   all       all                   trust

# IPv4 local (loopback)
host    all       all   127.0.0.1/32    scram-sha-256

# IPv6 local (loopback)
host    all       all   ::1/128         scram-sha-256

# Docker bridge networks (172.16.0.0/12 covers all default Docker subnets)
host    all       all   172.16.0.0/12   scram-sha-256

# Fallback: any other IPv4/IPv6 host (non-SSL ok for internal Docker traffic)
host    all       all   0.0.0.0/0       scram-sha-256
host    all       all   ::/0            scram-sha-256
