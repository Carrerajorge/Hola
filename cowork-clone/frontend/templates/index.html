<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cowork Clone - AI File Management Agent</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Loading animation */
        .loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 48px; height: 48px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-spinner"></div>
    </div>

    <div class="app-container">
        <!-- ═══ Sidebar ═══ -->
        <aside class="sidebar" id="sidebar">
            <!-- Logo -->
            <div class="sidebar-header">
                <div class="logo">C</div>
                <span class="logo-text">Cowork Clone</span>
                <span class="logo-version">v1.0</span>
            </div>

            <!-- Workspace -->
            <div class="workspace-section">
                <div class="workspace-label">Workspace</div>
                <div class="workspace-path-display" onclick="openSettings()">
                    <span class="icon">📁</span>
                    <span id="workspace-path">Loading...</span>
                    <span style="margin-left: auto; font-size: 11px; color: var(--text-muted);">⚙️</span>
                </div>
            </div>

            <!-- File Browser -->
            <div class="file-browser">
                <div class="file-browser-header">
                    <span class="file-browser-title">Files</span>
                    <button class="btn" style="padding: 4px 8px; font-size: 11px;" onclick="refreshFileBrowser()">↻</button>
                </div>
                <div id="file-browser-list">
                    <!-- Files will be rendered here -->
                </div>
            </div>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer">
                <div class="provider-badge">
                    <div class="provider-dot disconnected" id="provider-dot"></div>
                    <span id="provider-text">Connecting...</span>
                </div>
            </div>
        </aside>

        <!-- ═══ Main Content ═══ -->
        <main class="main-content">
            <!-- Header -->
            <div class="header-bar">
                <div class="header-title">💬 Chat</div>
                <div class="header-actions">
                    <button class="btn" onclick="resetSession()">🔄 New Chat</button>
                    <button class="btn" onclick="openSettings()">⚙️ Settings</button>
                </div>
            </div>

            <!-- Chat Container -->
            <div class="chat-container">
                <div class="messages-area" id="messages-area">
                    <!-- Messages rendered here -->
                </div>

                <!-- Input -->
                <div class="input-area">
                    <div class="input-wrapper">
                        <div class="input-field-wrapper">
                            <textarea
                                id="chat-input"
                                placeholder="Ask me to organize, create, search, or manage your files..."
                                rows="1"
                            ></textarea>
                        </div>
                        <button class="send-btn" id="send-btn" title="Send message">
                            ➤
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ═══ Settings Modal ═══ -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2 class="modal-title">⚙️ Settings</h2>

            <div class="form-group">
                <label class="form-label">Workspace Folder Path</label>
                <input
                    type="text"
                    class="form-input"
                    id="settings-workspace"
                    placeholder="/path/to/your/folder"
                >
                <small style="color: var(--text-muted); font-size: 11px; margin-top: 4px; display: block;">
                    The folder where the AI agent can read and manage files
                </small>
            </div>

            <div class="form-group">
                <label class="form-label">AI Provider</label>
                <select class="form-input form-select" id="settings-provider">
                    <option value="anthropic">Anthropic (Claude)</option>
                    <option value="openai">OpenAI (GPT-4)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">API Key</label>
                <input
                    type="password"
                    class="form-input"
                    id="settings-api-key"
                    placeholder="Enter your API key"
                >
                <small style="color: var(--text-muted); font-size: 11px; margin-top: 4px; display: block;">
                    Get your key from console.anthropic.com or platform.openai.com
                </small>
            </div>

            <div class="modal-actions">
                <button class="btn" onclick="closeSettings()">Cancel</button>
                <button class="btn btn-primary" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        // Hide loading screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
            }, 500);
        });
    </script>
</body>
</html>
