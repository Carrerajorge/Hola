[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iliagpt-ocr-service"
version = "0.1.0"
description = "ILIAGPT OCR microservice (FastAPI) with PaddleOCR primary and Tesseract fallback."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ILIAGPT" }]

dependencies = [
  "fastapi>=0.128.0",
  "httpx>=0.28.1",
  "numpy>=1.26.0,<3",
  "opencv-python-headless>=4.10.0.0",
  "orjson>=3.11.0",
  "Pillow>=11.0.0",
  "prometheus-client>=0.23.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.12.0",
  "PyMuPDF>=1.24.0",
  "python-multipart>=0.0.21",
  "pytesseract>=0.3.13",
  "structlog>=25.5.0",
  "tenacity>=9.0.0",
  "uvicorn>=0.40.0",
]

[project.optional-dependencies]
# PaddleOCR is the primary engine in production (Linux). On macOS/Windows, this extra is a no-op.
paddle = [
  "paddleocr>=2.7.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "paddlepaddle>=2.5.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
dev = [
  "hypothesis>=6.0.0",
  "pytest>=9.0.0",
  "pytest-cov>=6.0.0",
  "pytest-benchmark>=5.0.0",
]
all = [
  "hypothesis>=6.0.0",
  "pytest>=9.0.0",
  "pytest-cov>=6.0.0",
  "pytest-benchmark>=5.0.0",
  "paddleocr>=2.7.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "paddlepaddle>=2.5.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iliagpt_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
  "-q",
  "--tb=short",
  "--strict-markers",
  "--disable-warnings",
  "--cov=iliagpt_ocr",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=95",
]
markers = [
  "stress: longer-running stress tests",
]
