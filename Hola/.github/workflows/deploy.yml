name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Skip CI checks and deploy directly'
        required: false
        default: 'false'
        type: boolean
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Defaults: public SSH endpoint (port 8022).
  # GitHub runners cannot reach private Tailscale IPs without extra setup.
  VPS_HOST: 69.62.98.126
  VPS_USER: root
  VPS_PORT: "8022"
  DEPLOY_PATH: /opt/hola
  COMPOSE_PROJECT: iliagpt

jobs:
  # ── CI Gate ─────────────────────────────────────────────
  ci:
    name: CI Checks
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_ci != 'true' && github.event.inputs.skip_ci != true }}
    uses: ./.github/workflows/ci.yml

  # ── Manual Deploy ───────────────────────────────────────
  deploy_manual:
    name: Deploy to VPS (Manual)
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && ((github.event.inputs.skip_ci == 'true' || github.event.inputs.skip_ci == true) || needs.ci.result == 'success') }}
    timeout-minutes: 35
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '69.62.98.126' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '8022' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/hola' }}
      COMPOSE_PROJECT: ${{ secrets.COMPOSE_PROJECT || 'iliagpt' }}
    environment:
      name: production
      url: https://iliagpt.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Preflight target host
        run: |
          set -euo pipefail
          echo "▸ Deploy target: ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_PORT }}"
          DNS_IP="$(dig +short iliagpt.com | tail -n1 | tr -d '\n')"
          echo "▸ iliagpt.com resolves to: ${DNS_IP}"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Best-effort: StrictHostKeyChecking=no is used below, so failure to keyscan
          # should not hard-fail the workflow.
          ssh-keyscan -p ${{ env.VPS_PORT }} -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS
        run: |
          TARGET_SHA="${{ github.sha }}"
          ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "TARGET_SHA='${TARGET_SHA}' bash -s" << 'DEPLOY_SCRIPT'
            set -euo pipefail

            echo "═══════════════════════════════════════════"
            echo "  ILIAGPT Production Deploy"
            echo "  $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "═══════════════════════════════════════════"

            DEPLOY_PATH="/opt/hola"
            COMPOSE_FILE="docker-compose.prod.yml"
            PROJECT="iliagpt"

            cd "$DEPLOY_PATH"

            # ── Load SANDBOX_RUNNER_TOKEN for compose variable expansion ──
            # docker compose only expands ${VARS} from the process environment (and .env),
            # not from `env_file:`. Without this, runner auth tokens end up empty.
            if [ -f .env.production ]; then
              export SANDBOX_RUNNER_TOKEN="$(grep '^SANDBOX_RUNNER_TOKEN=' .env.production | head -n1 | cut -d= -f2- || true)"
              if [ -z "${SANDBOX_RUNNER_TOKEN:-}" ]; then
                export SANDBOX_RUNNER_TOKEN="$(openssl rand -hex 32)"
                if grep -q '^SANDBOX_RUNNER_TOKEN=' .env.production; then
                  sed -i "s/^SANDBOX_RUNNER_TOKEN=.*/SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN}/" .env.production
                else
                  echo "SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN}" >> .env.production
                fi
              fi
            fi

            # ── Checkout exact commit for deterministic deploys ──
            echo "▸ Fetching repository and checking out target SHA..."
            echo "▸ TARGET_SHA: ${TARGET_SHA}"
            git fetch origin main
            git checkout --force "${TARGET_SHA}"

            CURRENT_SHA="$(git rev-parse --short HEAD)"
            EXPECTED_SHA="$(echo "${TARGET_SHA}" | cut -c1-8)"
            echo "▸ Checked out SHA: ${CURRENT_SHA}"
            if [ "${CURRENT_SHA}" != "${EXPECTED_SHA}" ]; then
              echo "✗ Checked out SHA (${CURRENT_SHA}) does not match expected (${EXPECTED_SHA})"
              exit 1
            fi

            # Use the current git SHA for cache-busting (PWA/SW cleanup) and for /api/health version.
            export APP_VERSION="${CURRENT_SHA}"
            echo "▸ APP_VERSION: ${APP_VERSION}"

            compose() {
              APP_VERSION="${APP_VERSION}" SANDBOX_RUNNER_TOKEN="${SANDBOX_RUNNER_TOKEN:-}" \
                docker compose -p "$PROJECT" -f "$COMPOSE_FILE" "$@"
            }

            # ── Build new images ──
            echo "▸ Building Docker images (no cache)..."
            compose build --no-cache app worker sandbox-runner

            # ── Stop old containers (keep DB + Redis running) ──
            echo "▸ Rolling update: stopping app containers..."
            compose up -d postgres redis
            sleep 5
            echo "▸ Running database migrations..."
            compose run --rm -T --no-deps app node dist/migrate.cjs < /dev/null

            # ── Start updated containers ──
            echo "▸ Starting updated containers..."
            if ! compose up -d --force-recreate app worker sandbox-runner; then
              echo "⚠ First start failed. Cleaning legacy port 5000 owners and retrying..."
              docker ps --filter "publish=5000" --format '{{.ID}} {{.Names}}' \
                | awk -v p="${PROJECT}-" 'index($2,p)!=1 {print $1}' \
                | xargs -r docker stop || true
              docker ps -a --filter "publish=5000" --format '{{.ID}} {{.Names}}' \
                | awk -v p="${PROJECT}-" 'index($2,p)!=1 {print $1}' \
                | xargs -r docker rm || true
              if command -v pm2 >/dev/null 2>&1; then
                pm2 delete michat >/dev/null 2>&1 || true
              fi
              if command -v fuser >/dev/null 2>&1; then
                fuser -k 5000/tcp >/dev/null 2>&1 || true
              fi
              compose up -d --force-recreate app worker sandbox-runner
            fi

            # ── Wait for health check ──
            echo "▸ Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:5000/health > /dev/null 2>&1; then
                echo "✓ App is healthy!"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "✗ Health check failed after 30 attempts"
                compose logs --tail=50 app
                exit 1
              fi
              echo "  Attempt $i/30 - waiting..."
              sleep 5
            done

            # ── Cleanup old images ──
            echo "▸ Cleaning up old images..."
            docker image prune -f

            # ── Status report ──
            echo ""
            echo "═══════════════════════════════════════════"
            echo "  ✓ Deploy complete!"
            echo "═══════════════════════════════════════════"
            compose ps
            echo ""

            HEALTH_JSON="$(curl -sf http://127.0.0.1:5000/api/health)"
            echo "${HEALTH_JSON}"
            if ! echo "${HEALTH_JSON}" | grep -q "\"version\":\"${APP_VERSION}\""; then
              echo "✗ Version mismatch on local health endpoint"
              exit 1
            fi

            APP_HTML=""
            JS_ASSET=""
            for i in $(seq 1 10); do
              APP_HTML="$(curl -sf --max-time 20 http://127.0.0.1:5000/ || true)"
              JS_ASSET="$(echo "${APP_HTML}" | grep -oE 'assets/[A-Za-z0-9._-]+\\.js' | head -n1 || true)"
              if [ -n "${JS_ASSET}" ]; then
                break
              fi
              echo "  Waiting for frontend assets ($i/10)..."
              sleep 2
            done
            if [ -z "${JS_ASSET}" ]; then
              echo "✗ Could not find JS asset in app HTML"
              echo "${APP_HTML}" | head -n 40
              exit 1
            fi
            echo "▸ Main JS asset: ${JS_ASSET}"

            if ! curl -sf "http://127.0.0.1:5000/${JS_ASSET}" > /dev/null; then
              echo "✗ Could not fetch deployed JS asset: ${JS_ASSET}"
              exit 1
            fi

            if curl -sf "http://127.0.0.1:5000/${JS_ASSET}" | grep -q "siragpt_force_signed_out"; then
              echo "✓ Logout hotfix marker present"
            else
              echo "⚠ Logout hotfix marker not found (non-blocking)"
            fi
          DEPLOY_SCRIPT

      - name: Verify production
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.sha }}"
          EXPECTED_SHA="${EXPECTED_SHA:0:8}"
          echo "▸ Verifying https://iliagpt.com (expecting version ${EXPECTED_SHA})..."
          sleep 10
          STATUS=$(curl -sI --max-time 15 https://iliagpt.com | head -1 || echo "UNREACHABLE")
          echo "Response: $STATUS"
          if ! echo "$STATUS" | grep -qE "200|301|302"; then
            echo "❌ Production site is not responding correctly"
            exit 1
          fi

          HEALTH_JSON="$(curl -sf --max-time 20 https://iliagpt.com/api/health)"
          echo "$HEALTH_JSON"
          if ! echo "$HEALTH_JSON" | grep -q "\"version\":\"${EXPECTED_SHA}\""; then
            echo "❌ Production health version mismatch"
            exit 1
          fi

          HTML=""
          JS_ASSET=""
          for i in $(seq 1 10); do
            HTML="$(curl -sf --max-time 20 https://iliagpt.com/ || true)"
            JS_ASSET="$(echo "$HTML" | grep -oE 'assets/[A-Za-z0-9._-]+\\.js' | head -n1 || true)"
            if [ -n "$JS_ASSET" ]; then
              break
            fi
            echo "  Waiting for production frontend assets ($i/10)..."
            sleep 2
          done
          if [ -z "$JS_ASSET" ]; then
            echo "❌ Could not find production JS asset"
            echo "$HTML" | head -n 40
            exit 1
          fi
          echo "▸ Production JS asset: $JS_ASSET"

          if ! curl -sf --max-time 20 "https://iliagpt.com/$JS_ASSET" > /dev/null; then
            echo "❌ Could not download production JS asset"
            exit 1
          fi

          if curl -sf --max-time 20 "https://iliagpt.com/$JS_ASSET" | grep -q "siragpt_force_signed_out"; then
            echo "✓ Production logout hotfix marker present"
          else
            echo "⚠ Production logout hotfix marker not found (non-blocking)"
          fi

          echo "✓ Production site is live with expected deploy version and frontend assets"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to production FAILED. Check the logs above."
          echo "Manual rollback: ssh root@${{ env.VPS_HOST }} 'cd /opt/hola && git checkout HEAD~1 && docker compose -p iliagpt -f docker-compose.prod.yml up -d --build'"

  # ── Auto Deploy (after CI) ──────────────────────────────
  deploy_auto:
    name: Deploy to VPS (Auto)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 35
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '69.62.98.126' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '8022' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/hola' }}
      COMPOSE_PROJECT: ${{ secrets.COMPOSE_PROJECT || 'iliagpt' }}
    environment:
      name: production
      url: https://iliagpt.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Preflight target host
        run: |
          set -euo pipefail
          echo "▸ Deploy target: ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_PORT }}"
          DNS_IP="$(dig +short iliagpt.com | tail -n1 | tr -d '\n')"
          echo "▸ iliagpt.com resolves to: ${DNS_IP}"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.VPS_PORT }} -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS
        run: |
          TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
          ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "TARGET_SHA='${TARGET_SHA}' bash -s" << 'DEPLOY_SCRIPT'
            set -euo pipefail

            echo "═══════════════════════════════════════════"
            echo "  ILIAGPT Production Deploy"
            echo "  $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "═══════════════════════════════════════════"

            DEPLOY_PATH="/opt/hola"
            COMPOSE_FILE="docker-compose.prod.yml"
            PROJECT="iliagpt"

            cd "$DEPLOY_PATH"

            if [ -f .env.production ]; then
              export SANDBOX_RUNNER_TOKEN="$(grep '^SANDBOX_RUNNER_TOKEN=' .env.production | head -n1 | cut -d= -f2- || true)"
              if [ -z "${SANDBOX_RUNNER_TOKEN:-}" ]; then
                export SANDBOX_RUNNER_TOKEN="$(openssl rand -hex 32)"
                if grep -q '^SANDBOX_RUNNER_TOKEN=' .env.production; then
                  sed -i "s/^SANDBOX_RUNNER_TOKEN=.*/SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN}/" .env.production
                else
                  echo "SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN}" >> .env.production
                fi
              fi
            fi

            echo "▸ Fetching repository and checking out target SHA..."
            echo "▸ TARGET_SHA: ${TARGET_SHA}"
            git fetch origin main
            git checkout --force "${TARGET_SHA}"

            CURRENT_SHA="$(git rev-parse --short HEAD)"
            EXPECTED_SHA="$(echo "${TARGET_SHA}" | cut -c1-8)"
            echo "▸ Checked out SHA: ${CURRENT_SHA}"
            if [ "${CURRENT_SHA}" != "${EXPECTED_SHA}" ]; then
              echo "✗ Checked out SHA (${CURRENT_SHA}) does not match expected (${EXPECTED_SHA})"
              exit 1
            fi

            # Use the current git SHA for cache-busting (PWA/SW cleanup) and for /api/health version.
            export APP_VERSION="${CURRENT_SHA}"
            echo "▸ APP_VERSION: ${APP_VERSION}"

            compose() {
              APP_VERSION="${APP_VERSION}" SANDBOX_RUNNER_TOKEN="${SANDBOX_RUNNER_TOKEN:-}" \
                docker compose -p "$PROJECT" -f "$COMPOSE_FILE" "$@"
            }

            echo "▸ Building Docker images (no cache)..."
            compose build --no-cache app worker sandbox-runner

            echo "▸ Rolling update: stopping app containers..."
            compose up -d postgres redis
            sleep 5
            echo "▸ Running database migrations..."
            compose run --rm -T --no-deps app node dist/migrate.cjs < /dev/null

            echo "▸ Starting updated containers..."
            if ! compose up -d --force-recreate app worker sandbox-runner; then
              echo "⚠ First start failed. Cleaning legacy port 5000 owners and retrying..."
              docker ps --filter "publish=5000" --format '{{.ID}} {{.Names}}' \
                | awk -v p="${PROJECT}-" 'index($2,p)!=1 {print $1}' \
                | xargs -r docker stop || true
              docker ps -a --filter "publish=5000" --format '{{.ID}} {{.Names}}' \
                | awk -v p="${PROJECT}-" 'index($2,p)!=1 {print $1}' \
                | xargs -r docker rm || true
              if command -v pm2 >/dev/null 2>&1; then
                pm2 delete michat >/dev/null 2>&1 || true
              fi
              if command -v fuser >/dev/null 2>&1; then
                fuser -k 5000/tcp >/dev/null 2>&1 || true
              fi
              compose up -d --force-recreate app worker sandbox-runner
            fi

            echo "▸ Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:5000/health > /dev/null 2>&1; then
                echo "✓ App is healthy!"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "✗ Health check failed after 30 attempts"
                compose logs --tail=50 app
                exit 1
              fi
              echo "  Attempt $i/30 - waiting..."
              sleep 5
            done

            echo "▸ Cleaning up old images..."
            docker image prune -f

            echo ""
            echo "═══════════════════════════════════════════"
            echo "  ✓ Deploy complete!"
            echo "═══════════════════════════════════════════"
            compose ps
            echo ""

            HEALTH_JSON="$(curl -sf http://127.0.0.1:5000/api/health)"
            echo "${HEALTH_JSON}"
            if ! echo "${HEALTH_JSON}" | grep -q "\"version\":\"${APP_VERSION}\""; then
              echo "✗ Version mismatch on local health endpoint"
              exit 1
            fi

            APP_HTML=""
            JS_ASSET=""
            for i in $(seq 1 10); do
              APP_HTML="$(curl -sf --max-time 20 http://127.0.0.1:5000/ || true)"
              JS_ASSET="$(echo "${APP_HTML}" | grep -oE 'assets/[A-Za-z0-9._-]+\\.js' | head -n1 || true)"
              if [ -n "${JS_ASSET}" ]; then
                break
              fi
              echo "  Waiting for frontend assets ($i/10)..."
              sleep 2
            done
            if [ -z "${JS_ASSET}" ]; then
              echo "✗ Could not find JS asset in app HTML"
              echo "${APP_HTML}" | head -n 40
              exit 1
            fi
            echo "▸ Main JS asset: ${JS_ASSET}"

            if ! curl -sf "http://127.0.0.1:5000/${JS_ASSET}" > /dev/null; then
              echo "✗ Could not fetch deployed JS asset: ${JS_ASSET}"
              exit 1
            fi

            if curl -sf "http://127.0.0.1:5000/${JS_ASSET}" | grep -q "siragpt_force_signed_out"; then
              echo "✓ Logout hotfix marker present"
            else
