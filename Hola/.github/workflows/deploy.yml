            fi
          DEPLOY_SCRIPT

      - name: Verify production
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.workflow_run.head_sha }}"
          EXPECTED_SHA="${EXPECTED_SHA:0:8}"
          echo "▸ Verifying https://iliagpt.com (expecting version ${EXPECTED_SHA})..."
          sleep 10
          STATUS=$(curl -sI --max-time 15 https://iliagpt.com | head -1 || echo "UNREACHABLE")
          echo "Response: $STATUS"
