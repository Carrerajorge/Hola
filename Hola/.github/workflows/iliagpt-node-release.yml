name: iliagpt-node release (binaries)

on:
  push:
    tags:
      - "iliagpt-node-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pkgTarget: node20-linux-x64
            outName: iliagpt-node-linux
          - os: macos-latest
            pkgTarget: node20-macos-x64
            outName: iliagpt-node-macos
          - os: windows-latest
            pkgTarget: node20-win-x64
            outName: iliagpt-node-windows.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build iliagpt-node bundle
        run: node scripts/build-iliagpt-node.mjs

      - name: Install pkg
        run: npm i -g pkg@5

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          cd packages/iliagpt-node
          mkdir -p dist-bin
          pkg --targets "${{ matrix.pkgTarget }}" --output "dist-bin/${{ matrix.outName }}" dist/cli.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iliagpt-node-${{ matrix.os }}
          path: packages/iliagpt-node/dist-bin/${{ matrix.outName }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          ls -R artifacts
          mkdir -p release
          cp -v artifacts/iliagpt-node-windows-latest/iliagpt-node-windows.exe release/ || true
          cp -v artifacts/iliagpt-node-macos-latest/iliagpt-node-macos release/ || true
          cp -v artifacts/iliagpt-node-ubuntu-latest/iliagpt-node-linux release/ || true
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/iliagpt-node-windows.exe
            release/iliagpt-node-macos
            release/iliagpt-node-linux
          generate_release_notes: true
