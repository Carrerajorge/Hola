
services:

  app:

    build:

      context: .

      args:

        APP_VERSION: ${APP_VERSION:-dev}

    command: ["node", "dist/index.cjs"]

    env_file:

      - .env.production

    environment:

      NODE_ENV: production

      PORT: "5000"

      APP_VERSION: ${APP_VERSION:-dev}

      DATABASE_URL: postgres://postgres:postgres@postgres:5432/iliagpt

      REDIS_URL: redis://redis:6379

      AGENT_WORKSPACE_ROOT: /app/sandbox_workspace

      # Use isolated runner for shell_command execution (no docker socket in app)

      SHELL_COMMAND_SANDBOX_MODE: runner

      SHELL_COMMAND_RUNNER_URL: http://sandbox-runner:8080

      SHELL_COMMAND_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN}

    ports:

      - "5000:5000"

    volumes:

      - agent_workspace:/app/sandbox_workspace

    depends_on:

      - postgres

      - redis

      - sandbox-runner

    networks:

      - app-network

    healthcheck:

      disable: true

    mem_limit: 1g



  worker:

    build:

      context: .

      args:

        APP_VERSION: ${APP_VERSION:-dev}

    command: ["node", "dist/worker.cjs"]

    env_file:

      - .env.production

    environment:

      NODE_ENV: production

      APP_VERSION: ${APP_VERSION:-dev}

      DATABASE_URL: postgres://postgres:postgres@postgres:5432/iliagpt

      REDIS_URL: redis://redis:6379

    depends_on:

      - postgres

      - redis

    networks:

      - app-network

    healthcheck:

      disable: true

    mem_limit: 768m



  postgres:

    image: pgvector/pgvector:pg15

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: iliagpt

    volumes:

      - postgres_data:/var/lib/postgresql/data

    networks:

      - app-network



  redis:

    image: redis:alpine

    networks:

      - app-network



  sandbox-runner:

    build:

      context: .

      target: sandbox-runner

      args:

        APP_VERSION: ${APP_VERSION:-dev}

    env_file:

      - .env.production

    environment:

      NODE_ENV: production

      APP_VERSION: ${APP_VERSION:-dev}

      SANDBOX_RUNNER_PORT: "8080"

      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN}

      AGENT_WORKSPACE_ROOT: /workspace_root

      SHELL_COMMAND_DOCKER_IMAGE: debian:bookworm-slim

      SHELL_COMMAND_DOCKER_CPUS: "1"

      SHELL_COMMAND_DOCKER_MEMORY: 512m

      SHELL_COMMAND_DOCKER_PIDS: "256"

    volumes:

      - agent_workspace:/workspace_root

      - /var/run/docker.sock:/var/run/docker.sock

    expose:

      - "8080"

    networks:

      - app-network



networks:

  app-network:

    driver: bridge



volumes:

  postgres_data:

  agent_workspace:

