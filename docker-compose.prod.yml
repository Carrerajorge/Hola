
services:

  app:

    image: iliagpt-app:${APP_VERSION:-dev}

    build:

      context: .

      args:

        APP_VERSION: ${APP_VERSION:-dev}

    command: ["node", "dist/index.cjs"]

    env_file:

      - .env.production

    environment:

      NODE_ENV: production

      # Exposed via /api/health for deploy verification (set by deploy workflow).
      APP_VERSION: ${APP_VERSION:-dev}

      METRICS_PUBLIC: ${METRICS_PUBLIC:-false}

      PORT: "5000"

      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-iliagpt}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      ENABLE_AGENT_BACKGROUND_QUEUE: "true"

      AGENT_WORKSPACE_ROOT: /app/sandbox_workspace

      # Use isolated runner for shell_command execution (no docker socket in app)

      SHELL_COMMAND_SANDBOX_MODE: runner

      SHELL_COMMAND_RUNNER_URL: http://sandbox-runner:8080

      SHELL_COMMAND_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:?SANDBOX_RUNNER_TOKEN is required}

      OCR_SERVICE_URL: http://ocr:8000

    ports:

      - "5000:5000"

    volumes:

      - agent_workspace:/app/sandbox_workspace

    depends_on:

      - postgres

      - redis

      - sandbox-runner

      - ocr

    networks:

      - app-network

    healthcheck:

      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health >/dev/null || exit 1"]

      interval: 20s

      timeout: 5s

      retries: 5

    mem_limit: 2g

    # Chromium (Playwright) needs /dev/shm > 64MB to avoid crashes
    shm_size: 256m



  worker:

    image: iliagpt-app:${APP_VERSION:-dev}

    command: ["node", "dist/worker.cjs"]

    env_file:

      - .env.production

    environment:

      NODE_ENV: production

      APP_VERSION: ${APP_VERSION:-dev}

      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-iliagpt}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      ENABLE_AGENT_BACKGROUND_QUEUE: "true"


      OCR_SERVICE_URL: http://ocr:8000

    depends_on:

      - postgres

      - redis

      - ocr

    networks:

      - app-network

    healthcheck:

      disable: true

    mem_limit: 768m


  migrate:

    image: iliagpt-app:${APP_VERSION:-dev}

    profiles:
      - ops

    command: ["node", "dist/migrate.cjs"]

    env_file:

      - .env.production

    environment:

      NODE_ENV: production

      APP_VERSION: ${APP_VERSION:-dev}

      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-iliagpt}

    depends_on:

      - postgres

    networks:

      - app-network

    restart: "no"



  postgres:

    image: pgvector/pgvector:pg15

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      POSTGRES_DB: ${POSTGRES_DB:-iliagpt}

    volumes:

      - postgres_data:/var/lib/postgresql/data

    networks:

      - app-network



  redis:

    image: redis:alpine

    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]

    networks:

      - app-network



  sandbox-runner:

    image: iliagpt-sandbox-runner:${APP_VERSION:-dev}

    build:

      context: .

      target: sandbox-runner

      args:

        APP_VERSION: ${APP_VERSION:-dev}

    env_file:

      - .env.production

    environment:

      NODE_ENV: production

      APP_VERSION: ${APP_VERSION:-dev}

      SANDBOX_RUNNER_PORT: "8080"


      AGENT_WORKSPACE_ROOT: /workspace_root

      SHELL_COMMAND_DOCKER_IMAGE: debian:bookworm-slim

      SHELL_COMMAND_DOCKER_CPUS: "1"

      SHELL_COMMAND_DOCKER_MEMORY: 512m

      SHELL_COMMAND_DOCKER_NETWORK: bridge

      SHELL_COMMAND_DOCKER_PIDS: "256"

    volumes:

      - agent_workspace:/workspace_root

      - /var/run/docker.sock:/var/run/docker.sock

    security_opt:

      - no-new-privileges:true

    cap_drop:

      - ALL

    pids_limit: 256

    expose:

      - "8080"

    networks:

      - app-network


  ocr:

    image: iliagpt-ocr:${APP_VERSION:-dev}

    build:

      context: .

      dockerfile: ocr_service/Dockerfile

    env_file:

      - .env.production

    environment:

      OCR_HOST: 0.0.0.0

      OCR_PORT: "8000"

      OCR_PREFER_ENGINE: ${OCR_PREFER_ENGINE:-auto}

      OCR_DEFAULT_LANG: ${OCR_DEFAULT_LANG:-eng}

      OCR_DPI: ${OCR_DPI:-300}

      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-10}

      OCR_MAX_FILE_SIZE_MB: ${OCR_MAX_FILE_SIZE_MB:-15}

      OCR_MAX_CONCURRENT_REQUESTS: ${OCR_MAX_CONCURRENT_REQUESTS:-4}

      OCR_API_KEY: ${OCR_API_KEY:-}

      OCR_LOG_LEVEL: ${OCR_LOG_LEVEL:-INFO}

    expose:

      - "8000"

    volumes:

      - ocr_models:/root/.paddleocr

    networks:

      - app-network

    healthcheck:

      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null || exit 1"]

      interval: 10s

      timeout: 3s

      retries: 10

    mem_limit: 1g


  prometheus:

    image: prom/prometheus:v2.54.1

    profiles:

      - monitoring

    command:

      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

    volumes:

      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:

      - "${PROMETHEUS_PORT:-9090}:9090"

    depends_on:

      - app

    networks:

      - app-network

    restart: unless-stopped


  influxdb:

    image: influxdb:2.7-alpine

    profiles:

      - monitoring

    env_file:

      - .env.production

    environment:

      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-}
      # Compatibility: accepts legacy INFLUX_TOKEN as fallback for INFLUXDB_ADMIN_TOKEN.
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:-${INFLUX_TOKEN}}

    volumes:

      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

    ports:

      - "${INFLUXDB_PORT:-8086}:8086"

    networks:

      - app-network

    healthcheck:

      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8086/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

    restart: unless-stopped

networks:

  app-network:

    driver: bridge



volumes:

  postgres_data:

  agent_workspace:

  ocr_models:

  prometheus_data:

  influxdb_data:

  influxdb_config:
