name: Bug report
description: Report a reproducible problem in ILIAGPT
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - client (UI)
        - server (API)
        - auth
        - agent/tools
        - docs
        - CI
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Include screenshots if relevant.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide step-by-step instructions.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste relevant logs. Please redact secrets.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: If known (tag, commit SHA).

