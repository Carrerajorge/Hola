openapi: 3.0.3
info:
  title: ILIAGPT API
  description: |
    API pública de ILIAGPT - Asistente de IA avanzado para productividad y documentos.
    
    ## Autenticación
    La API utiliza tokens Bearer JWT. Incluye el token en el header `Authorization`:
    ```
    Authorization: Bearer <tu-token>
    ```
    
    ## Límites de Tasa
    - Chat: 60 req/min
    - Documentos: 20 req/min
    - AI: 30 req/min
    
    ## Errores Comunes
    - `401`: Token inválido o expirado
    - `429`: Límite de tasa excedido
    - `500`: Error interno del servidor
  version: 1.0.0
  contact:
    name: ILIAGPT Support
    email: api@iliagpt.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:5000/api
    description: Development
  - url: https://api.iliagpt.com/v1
    description: Production

tags:
  - name: Auth
    description: Autenticación y usuarios
  - name: Chats
    description: Gestión de conversaciones
  - name: Messages
    description: Mensajes en chats
  - name: Documents
    description: Generación de documentos
  - name: Files
    description: Subida y gestión de archivos
  - name: RunTraces
    description: Workflow run traces con persistencia y streaming resiliente

paths:
  # ============================================
  # AUTH
  # ============================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  mfaRequired:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Verificar código MFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, code]
              properties:
                userId:
                  type: integer
                code:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: MFA verificado
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============================================
  # CHATS
  # ============================================
  /chats:
    get:
      tags: [Chats]
      summary: Listar chats del usuario
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de chats
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items:
                      $ref: '#/components/schemas/Chat'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Chats]
      summary: Crear nuevo chat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                projectId:
                  type: string
                systemPrompt:
                  type: string
      responses:
        '201':
          description: Chat creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'

  /chats/{chatId}:
    get:
      tags: [Chats]
      summary: Obtener chat por ID
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chat encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatWithMessages'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Chats]
      summary: Eliminar chat
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Chat eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # MESSAGES
  # ============================================
  /chat/ai:
    post:
      tags: [Messages]
      summary: Enviar mensaje y recibir respuesta AI
      description: |
        Envía un mensaje al AI y recibe respuesta streamed via SSE.
        El response es un stream de eventos Server-Sent Events.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                chatId:
                  type: string
                message:
                  type: string
                model:
                  type: string
                  enum: [grok-3, grok-3-fast, grok-3-mini-fast, gemini-2.5-pro]
                  default: grok-3-fast
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
                  default: 0.7
                attachments:
                  type: array
                  items:
                    $ref: '#/components/schemas/Attachment'
      responses:
        '200':
          description: Stream de respuesta AI
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream con chunks de respuesta
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================
  # DOCUMENTS
  # ============================================
  /documents/generate:
    post:
      tags: [Documents]
      summary: Generar documento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, description]
              properties:
                type:
                  type: string
                  enum: [word, excel, powerpoint, pdf]
                description:
                  type: string
                template:
                  type: string
      responses:
        '200':
          description: Documento generado
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'

  /documents/execute-code:
    post:
      tags: [Documents]
      summary: Ejecutar código DOCX
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Código JavaScript usando librería docx
      responses:
        '200':
          description: DOCX generado
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary

  # ============================================
  # FILES
  # ============================================
  /files/upload:
    post:
      tags: [Files]
      summary: Subir archivo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                chatId:
                  type: string
      responses:
        '200':
          description: Archivo subido
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  url:
                    type: string
                  size:
                    type: integer

  # ============================================
  # RUN TRACES (WORKFLOW)
  # ============================================
  /run-traces/runs:
    post:
      tags: [RunTraces]
      summary: Crear workflow run
      description: Crea un run y ejecuta el plan con persistencia idempotente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRunCreateRequest'
            examples:
              simple:
                value:
                  chatId: "chat_123"
                  idempotencyKey: "wf-2026-02-28-001"
                  plan:
                    objective: "Run trace repro"
                    concurrency: 1
                    steps:
                      - id: "prepare"
                        name: "Prepare context"
                        toolName: "noop"
                        executorKey: "noop"
      responses:
        '201':
          description: Run creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunCreateResponse'
        '200':
          description: Run previo reutilizado por idempotencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /run-traces/runs/{id}:
    get:
      tags: [RunTraces]
      summary: Obtener estado del run
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estado del run, steps y artefactos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /run-traces/runs/{id}/events:
    get:
      tags: [RunTraces]
      summary: Listar eventos persistidos
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: afterSeq
          in: query
          schema:
            type: integer
            minimum: 0
          description: Retorna eventos con event_seq > afterSeq
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Eventos de ejecución
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowEventsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /run-traces/runs/{id}/stream:
    get:
      tags: [RunTraces]
      summary: Stream SSE de eventos del run
      description: |
        Stream ordenado y durable con reconexión/catch-up.
        - Usa `id:` = `event_seq`
        - Envía `retry: 1500`
        - Soporta `Last-Event-ID` y `lastEventId` para reanudar sin pérdida.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
        - name: lastEventId
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  retry: 1500
                  id: 12
                  event: step_completed
                  data: {"event_seq":12,"event_type":"step_completed"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /run-traces/runs/{id}/cancel:
    post:
      tags: [RunTraces]
      summary: Cancelar run activo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelación aceptada
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  cancelled:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Run no cancelable en estado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ws/run-traces:
    get:
      tags: [RunTraces]
      summary: WebSocket run traces
      description: |
        Endpoint de upgrade WS para suscripción y catch-up.
        Mensaje de cliente:
        `{ "type":"subscribe", "runId":"...", "lastEventId":123 }`
        Mensaje de servidor:
        `{ "type":"event", "id":124, "event":"step_completed", "data": {...} }`
      responses:
        '101':
          description: Switching Protocols

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        avatar:
          type: string
        mfaEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Chat:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        projectId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer

    ChatWithMessages:
      allOf:
        - $ref: '#/components/schemas/Chat'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    Message:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        timestamp:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'

    Attachment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        size:
          type: integer
        url:
          type: string

    WorkflowRunCreateRequest:
      type: object
      required: [chatId, plan]
      properties:
        chatId:
          type: string
        userId:
          type: string
          nullable: true
        idempotencyKey:
          type: string
        traceId:
          type: string
        variables:
          type: object
          additionalProperties: true
        plan:
          $ref: '#/components/schemas/WorkflowPlan'

    WorkflowPlan:
      type: object
      required: [objective, steps]
      properties:
        objective:
          type: string
        concurrency:
          type: integer
          minimum: 1
        metadata:
          type: object
          additionalProperties: true
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkflowStep'

    WorkflowStep:
      type: object
      required: [id, name, toolName]
      properties:
        id:
          type: string
        name:
          type: string
        toolName:
          type: string
        executorKey:
          type: string
        description:
          type: string
        dependencies:
          type: array
          items:
            type: string
        timeoutMs:
          type: integer
          minimum: 1
        retryPolicy:
          type: object
          properties:
            attempts:
              type: integer
              minimum: 1
            backoffMs:
              type: integer
              minimum: 0
            maxBackoffMs:
              type: integer
              minimum: 0
        input:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    WorkflowRunCreateResponse:
      type: object
      properties:
        runId:
          type: string
        reused:
          type: boolean
        streamUrl:
          type: string

    WorkflowRunDetails:
      type: object
      properties:
        id:
          type: string
        chatId:
          type: string
        status:
          type: string
        error:
          type: string
          nullable: true
        totalSteps:
          type: integer
        completedSteps:
          type: integer
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        steps:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              stepIndex:
                type: integer
              toolName:
                type: string
              status:
                type: string
              retryCount:
                type: integer
              error:
                type: string
                nullable: true
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowArtifact'

    WorkflowArtifact:
      type: object
      properties:
        id:
          type: string
        stepId:
          type: string
        stepIndex:
          type: integer
        artifactKey:
          type: string
        type:
          type: string
        name:
          type: string
        url:
          type: string
          nullable: true
        payload:
          type: object
          nullable: true
          additionalProperties: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true

    WorkflowEventsResponse:
      type: object
      properties:
        runId:
          type: string
        order:
          type: string
        limit:
          type: integer
        afterSeq:
          type: integer
          nullable: true
        lastEventSeq:
          type: integer
        events:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStreamEvent'

    WorkflowStreamEvent:
      type: object
      properties:
        event_seq:
          type: integer
        event_type:
          type: string
        runId:
          type: string
        correlation_id:
          type: string
        trace_id:
          type: string
          nullable: true
        span_id:
          type: string
          nullable: true
        stepId:
          type: string
          nullable: true
        stepIndex:
          type: integer
          nullable: true
        severity:
          type: string
          enum: [info, warning, error]
        timestamp:
          type: integer
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: string

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Límite de tasa excedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
