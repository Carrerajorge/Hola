<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="15" />
  <title>ILIAGPT – Volvemos enseguida</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f11;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.25rem;
      letter-spacing: -0.03em;
    }

    .pulse-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid #818cf8;
      margin: 1.5rem auto;
      position: relative;
      animation: pulse 2s ease-in-out infinite;
    }
    .pulse-ring::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(129,140,248,0.3);
      animation: pulse 2s ease-in-out 0.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.96); }
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #f0f0ff;
    }

    p {
      font-size: 0.95rem;
      color: #9090b0;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .refresh-note {
      font-size: 0.82rem;
      color: #6060a0;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #2a2a3a;
    }

    .dot {
      display: inline-block;
      animation: blink 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ILIAGPT</div>

    <div class="pulse-ring"></div>

    <h1>Actualizando el sistema<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></h1>

    <p>
      Estamos desplegando una nueva versión. El servicio
      estará disponible de nuevo en unos segundos.
    </p>

    <p class="refresh-note">
      Esta página se recargará automáticamente cada 15 segundos.
    </p>
  </div>
</body>
</html>
