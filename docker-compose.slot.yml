# ═══════════════════════════════════════════════════════════
#  Blue-Green Slot Template (hardened v2)
#  One instance per slot. Env vars: SLOT, HOST_PORT, IMAGE_TAG, APP_VERSION
#
#  Usage:
#    SLOT=blue  HOST_PORT=5000 IMAGE_TAG=sha-abc12345 docker compose -p hola-blue  -f docker-compose.slot.yml up -d
#    SLOT=green HOST_PORT=5001 IMAGE_TAG=sha-abc12345 docker compose -p hola-green -f docker-compose.slot.yml up -d
# ═══════════════════════════════════════════════════════════

services:
  app:
    image: ghcr.io/carrerajorge/iliagpt-app:${IMAGE_TAG:-latest}
    container_name: hola-${SLOT:-blue}-app
    hostname: hola-${SLOT:-blue}-app
    # Use tini as PID 1 for proper signal forwarding and zombie reaping
    init: true
    command: ["node", "dist/index.cjs"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-dev}
      METRICS_PUBLIC: ${METRICS_PUBLIC:-false}
      PORT: "5000"
      DATABASE_URL: postgres://postgres:postgres@hola-postgres:5432/iliagpt
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password_change_me}@hola-redis:6379
      AGENT_WORKSPACE_ROOT: /app/sandbox_workspace
      SHELL_COMMAND_SANDBOX_MODE: runner
      SHELL_COMMAND_RUNNER_URL: http://hola-${SLOT:-blue}-sandbox:8080
      SHELL_COMMAND_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN}
      OCR_SERVICE_URL: http://hola-ocr:8000
    ports:
      - "127.0.0.1:${HOST_PORT:-5000}:5000"
    volumes:
      - agent_workspace:/app/sandbox_workspace
      - whatsapp_data:/app/data
      - uploads_data:/app/uploads
      - generated_artifacts:/app/generated_artifacts
    # tmpfs for ephemeral temp files (faster, no disk wear)
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - hola-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=3", "http://127.0.0.1:5000/api/health/ready"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    # ── Security hardening ────────────────────────────
    security_opt:
      - no-new-privileges:true
    # ── Resource limits ──────────────────────────────
    mem_limit: 2g
    mem_reservation: 512m
    shm_size: 256m
    cpus: 2.0
    # ── OOM: prefer killing app over infra services ──
    oom_score_adj: 200
    # ── File descriptor limits (needed for many WS + DB connections) ──
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      core:
        soft: 0
        hard: 0
    # ── Logging: cap size so disk doesn't fill ──
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "{{.Name}}"
    # ── Graceful shutdown ──
    stop_grace_period: 20s
    # ── Restart policy ──
    restart: unless-stopped
    # ── Labels for monitoring / inspection ──
    labels:
      com.iliagpt.component: "app"
      com.iliagpt.slot: "${SLOT:-blue}"
      com.iliagpt.version: "${APP_VERSION:-dev}"
      com.iliagpt.image: "${IMAGE_TAG:-latest}"

  worker:
    image: ghcr.io/carrerajorge/iliagpt-app:${IMAGE_TAG:-latest}
    container_name: hola-${SLOT:-blue}-worker
    hostname: hola-${SLOT:-blue}-worker
    init: true
    command: ["node", "dist/worker.cjs"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: postgres://postgres:postgres@hola-postgres:5432/iliagpt
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password_change_me}@hola-redis:6379
      OCR_SERVICE_URL: http://hola-ocr:8000
    volumes:
      - uploads_data:/app/uploads
      - generated_artifacts:/app/generated_artifacts
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - hola-net
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    # ── Security hardening ────────────────────────────
    security_opt:
      - no-new-privileges:true
    # ── Resource limits ──────────────────────────────
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0
    oom_score_adj: 300
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
      core:
        soft: 0
        hard: 0
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"
        tag: "{{.Name}}"
    stop_grace_period: 15s
    restart: unless-stopped
    labels:
      com.iliagpt.component: "worker"
      com.iliagpt.slot: "${SLOT:-blue}"
      com.iliagpt.version: "${APP_VERSION:-dev}"
      com.iliagpt.image: "${IMAGE_TAG:-latest}"

  sandbox-runner:
    image: ghcr.io/carrerajorge/iliagpt-sandbox:${IMAGE_TAG:-latest}
    container_name: hola-${SLOT:-blue}-sandbox
    hostname: hola-${SLOT:-blue}-sandbox
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-dev}
      SANDBOX_RUNNER_PORT: "8080"
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN}
      AGENT_WORKSPACE_ROOT: /workspace_root
      SHELL_COMMAND_DOCKER_IMAGE: debian:bookworm-slim
      SHELL_COMMAND_DOCKER_CPUS: "1"
      SHELL_COMMAND_DOCKER_MEMORY: 512m
      SHELL_COMMAND_DOCKER_PIDS: "256"
    volumes:
      - agent_workspace:/workspace_root
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose:
      - "8080"
    networks:
      - hola-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=2 http://127.0.0.1:8080/health || kill -0 1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # ── Security hardening (mirrors docker-compose.prod.yml) ──
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Needed for Docker socket interaction and child container management
      - SYS_ADMIN
    pids_limit: 256
    # ── Resource limits ──────────────────────────────
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 1.5
    oom_score_adj: 400
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
      core:
        soft: 0
        hard: 0
    logging:
      driver: json-file
      options:
        max-size: "15m"
        max-file: "3"
        tag: "{{.Name}}"
    stop_grace_period: 10s
    restart: unless-stopped
    labels:
      com.iliagpt.component: "sandbox"
      com.iliagpt.slot: "${SLOT:-blue}"
      com.iliagpt.version: "${APP_VERSION:-dev}"
      com.iliagpt.image: "${IMAGE_TAG:-latest}"

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles:
      - monitoring
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - app
    networks:
      - hola-net
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7-alpine
    profiles:
      - monitoring
    env_file:
      - .env.production
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?INFLUXDB_USERNAME is required}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD is required}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?INFLUXDB_ORG is required}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?INFLUXDB_BUCKET is required}
      # Compatibility: accepts legacy INFLUX_TOKEN as fallback for INFLUXDB_ADMIN_TOKEN.
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:-${INFLUX_TOKEN}}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    networks:
      - hola-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8086/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

networks:
  hola-net:
    external: true

volumes:
  agent_workspace:
    name: hola_agent_workspace
  whatsapp_data:
    name: hola_whatsapp_data
  uploads_data:
    name: hola_uploads_data
  generated_artifacts:
    name: hola_generated_artifacts
  prometheus_data:
  influxdb_data:
  influxdb_config:
